# Apply after iximiuz-core. Plain HTTP on a private lab network, not a production edge.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: coffeeshop
  namespace: coffeeshop-lab
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coffeeshop-menu
  namespace: coffeeshop-lab
spec:
  parentRefs:
    - name: coffeeshop
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/
      backendRefs:
        - name: proxy
          port: 5000
