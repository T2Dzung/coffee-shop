apiVersion: v1
kind: Namespace
metadata:
  name: coffeeshop-lab-data
  labels:
    app.kubernetes.io/managed-by: platformctl-lab
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: coffeeshop-lab-local
  annotations:
    defaultVolumeType: local
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false
