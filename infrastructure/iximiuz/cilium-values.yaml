# Isolated playground API; do not use this values file against DEV/PROD.
kubeProxyReplacement: true
k8sServiceHost: 172.16.0.2
k8sServicePort: 6443
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList: [10.42.0.0/16]
routingMode: tunnel
tunnelProtocol: vxlan
operator:
  replicas: 1
hubble:
  enabled: true
  relay:
    enabled: true
gatewayAPI:
  enabled: true
  hostNetwork:
    enabled: true
