apiVersion: v1
kind: ResourceQuota
metadata:
  name: runner-compute-quota
  namespace: ci-runners
spec:
  hard:
    pods: "6"
    requests.cpu: "4"
    requests.memory: 6Gi
    limits.cpu: "8"
    limits.memory: 12Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: runner-container-limits
  namespace: ci-runners
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: "2"
        memory: 2Gi
      max:
        cpu: "4"
        memory: 4Gi
