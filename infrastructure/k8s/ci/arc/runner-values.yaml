githubConfigUrl: "https://github.com/OWNER/REPOSITORY"
githubConfigSecret: github-actions-credentials
runnerScaleSetName: trusted-build

controllerServiceAccount:
  name: arc-controller
  namespace: arc-systems

minRunners: 0
maxRunners: 2

template:
  spec:
    automountServiceAccountToken: false
    hostNetwork: false
    hostPID: false
    hostIPC: false
    securityContext:
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    initContainers:
      - name: dind
        image: docker:24.0.7-dind
        imagePullPolicy: IfNotPresent
        restartPolicy: Always
        env:
          - name: DOCKER_TLS_CERTDIR
            value: ""
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 3Gi
        volumeMounts:
          - name: docker-storage
            mountPath: /var/lib/docker
    containers:
      - name: runner
        # Built and imported into the CI host's K3s containerd by the arc_runner
        # Ansible role. The image extends the pinned upstream runner only with
        # tools declared by the candidate-runner contract.
        image: docker.io/library/coffeeshop-actions-runner:2.334.0-go1
        imagePullPolicy: Never
        command: ["/home/runner/run.sh"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
          - name: DOCKER_HOST
            value: tcp://localhost:2375
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        volumeMounts:
          - name: go-cache
            mountPath: /go-cache
    volumes:
      - name: go-cache
        persistentVolumeClaim:
          claimName: go-cache
      - name: docker-storage
        emptyDir:
          sizeLimit: 16Gi
