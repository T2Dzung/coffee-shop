apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runner-coffeeshop
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
      chart: gha-runner-scale-set
      targetRevision: 0.9.0
      helm:
        valueFiles:
          - $values/infrastructure/k8s/gitops/addons/arc/runner-values.yaml
    - repoURL: https://github.com/T2Dzung/coffee-shop.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: dev-ci
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
