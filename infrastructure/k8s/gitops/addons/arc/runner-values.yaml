githubConfigUrl: "https://github.com/T2Dzung/coffee-shop"
githubConfigSecret: "github-actions-token-secret"  # Provided by Ansible arc_runner role

runnerScaleSetName: "coffeeshop-runner"

controllerServiceAccount:
  name: arc-system-gha-rs-controller
  namespace: arc-systems

minRunners: 2
maxRunners: 7

template:
  spec:
    securityContext:
      fsGroup: 1000

    initContainers:
      - name: dind
        image: docker:24.0.7-dind
        imagePullPolicy: IfNotPresent
        restartPolicy: Always
        env:
          - name: DOCKER_TLS_CERTDIR
            value: ""
        securityContext:
          privileged: true  # Kept as fallback in Phase 3
        resources:
          limits:
            cpu: "1"
            memory: "1.5Gi"
          requests:
            cpu: "100m"
            memory: "512Mi"
        volumeMounts:
          - name: docker-storage
            mountPath: /var/lib/docker

    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.333.1
        imagePullPolicy: IfNotPresent
        command: ["/home/runner/run.sh"]
        env:
          - name: DOCKER_HOST
            value: "tcp://localhost:2375"
        resources:
          limits:
            cpu: "2"
            memory: "2Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
        volumeMounts:
          - name: go-cache
            mountPath: /go/pkg/mod

    volumes:
      - name: go-cache
        emptyDir: {}  # Changed from PVC to emptyDir for Phase 3 (Fix Pending issue)
      - name: docker-storage
        emptyDir: {}
