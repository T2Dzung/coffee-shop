apiVersion: v1
kind: ConfigMap
metadata:
  name: coffeeshop-config
  namespace: coffeeshop
data:
  APP_NAME_PRODUCT: "product-service"
  APP_NAME_COUNTER: "counter-service"
  APP_NAME_BARISTA: "barista-service"
  APP_NAME_KITCHEN: "kitchen-service"
  APP_NAME_PROXY: "proxy-service"

  GRPC_PRODUCT_HOST: "product"
  GRPC_PRODUCT_PORT: "5001"
  GRPC_COUNTER_HOST: "counter"
  GRPC_COUNTER_PORT: "5002"
  PRODUCT_CLIENT_URL: "product:5001"

  REVERSE_PROXY_URL: "/api"
  WEB_PORT: "8888"
  IN_DOCKER: "true"

  OTEL_EXPORTER_OTLP_ENDPOINT: "none"
  # The application supports one bounded sampler contract. Ratio 0 disables
  # export while preserving the same parser/runtime path used by DEV.
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "0.0"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment.name=prod"
