apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: coffeeshop
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: go-coffeeshop-web
          imagePullPolicy: IfNotPresent
          env:
            - name: REVERSE_PROXY_URL
              value: "/api"
            - name: WEB_PORT
              valueFrom:
                configMapKeyRef:
                  name: coffeeshop-config
                  key: WEB_PORT
          ports:
            - containerPort: 8888
              name: web-port
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          readinessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 3
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: coffeeshop
spec:
  ports:
    - port: 8888
      targetPort: 8888
  selector:
    app: web
