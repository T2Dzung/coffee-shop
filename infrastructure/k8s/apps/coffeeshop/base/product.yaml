apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
  namespace: coffeeshop
  labels:
    app: product
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product
  template:
    metadata:
      labels:
        app: product
    spec:
      containers:
        - name: product
          image: go-coffeeshop-product
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: coffeeshop-config
                  key: APP_NAME_PRODUCT
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: coffeeshop-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: OTEL_TRACES_SAMPLER
              valueFrom:
                configMapKeyRef:
                  name: coffeeshop-config
                  key: OTEL_TRACES_SAMPLER
            - name: OTEL_TRACES_SAMPLER_ARG
              valueFrom:
                configMapKeyRef:
                  name: coffeeshop-config
                  key: OTEL_TRACES_SAMPLER_ARG
            - name: OTEL_RESOURCE_ATTRIBUTES
              valueFrom:
                configMapKeyRef:
                  name: coffeeshop-config
                  key: OTEL_RESOURCE_ATTRIBUTES
          ports:
            - containerPort: 5001
              name: grpc
          resources:
            requests:
              cpu: 40m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            tcpSocket:
              port: 5001
            initialDelaySeconds: 3
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: product
  namespace: coffeeshop
spec:
  ports:
    - port: 5001
      targetPort: 5001
  selector:
    app: product
