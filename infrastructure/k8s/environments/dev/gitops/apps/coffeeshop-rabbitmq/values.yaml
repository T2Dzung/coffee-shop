replicas: 3

# Empty means RabbitMQ Cluster Operator default. Set only when a custom/private
# registry image is intentionally required.
image: ""

storage:
  storageClass: longhorn-rabbitmq
  size: 5Gi

# Dev profile: keep requests low enough for the EC2/K3s lab cluster while
# keeping RabbitMQ memory request equal to limit as required by the Operator. Prod should revisit this from real load metrics.
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 1Gi

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
