deploymentMode: Monolithic

defaults:
  automountServiceAccountToken: false

serviceAccount:
  automountServiceAccountToken: false

rbac:
  namespaced: true

sidecar:
  rules:
    enabled: false

networkPolicy:
  enabled: true
  ingress:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
  metrics:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    retention_period: 72h
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem
  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  sidecar: false
  podDisruptionBudget:
    enabled: false
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  persistence:
    enabled: true
    enableStatefulSetAutoDeletePVC: false
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    storageClass: longhorn-observability

# The chart keeps these components enabled by default for other deployment
# modes. Zero them explicitly so Monolithic cannot drift into a larger topology.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: true
  replicas: 1
  verboseLogging: false
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  metrics:
    enabled: false

minio:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: true
