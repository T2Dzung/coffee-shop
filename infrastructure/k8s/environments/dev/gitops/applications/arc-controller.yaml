apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-system
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set-controller
    targetRevision: 0.14.2
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-systems
  ignoreDifferences:
    # ArgoCD 2.11 structured-merge diff is triggered by ServerSideApply=true.
    # Kubernetes 1.33+ may expose Deployment.status.terminatingReplicas before
    # ArgoCD's typed schema knows that field, causing ComparisonError.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status/terminatingReplicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
