apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coffeeshop-rabbitmq
  namespace: coffeeshop
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: coffeeshop-rabbitmq
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: coffeeshop-rabbitmq
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [counter, barista, kitchen]
      ports:
        - protocol: TCP
          port: 5672
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rabbitmq-system
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
