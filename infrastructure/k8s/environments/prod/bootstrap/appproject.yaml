apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: coffeeshop-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Bounded Argo CD AppProject for PROD CoffeeShop Application and Platform Integration
  sourceRepos:
    - '__GITOPS_REPO_URL__'
  destinations:
    - namespace: coffeeshop
      server: https://kubernetes.default.svc
    - namespace: platform-ownership-guard-system
      server: https://kubernetes.default.svc
    - namespace: external-secrets
      server: https://kubernetes.default.svc
    - namespace: rabbitmq-system
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: external-secrets.io
      kind: ClusterSecretStore
    - group: storage.k8s.io
      kind: StorageClass
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Secret
    - group: ''
      kind: Service
    - group: ''
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: batch
      kind: Job
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: policy
      kind: PodDisruptionBudget
    - group: coordination.k8s.io
      kind: Lease
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: guard.platform.t2dzung.github.io
      kind: OwnershipAudit
    - group: external-secrets.io
      kind: ExternalSecret
    - group: rabbitmq.com
      kind: RabbitmqCluster
