apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: coffeeshop-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Bounded Argo CD AppProject for PROD-2 CoffeeShop Application
  sourceRepos:
    - '__GITOPS_REPO_URL__'
  destinations:
    - namespace: coffeeshop
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Service
    - group: apps
      kind: Deployment
    - group: networking.k8s.io
      kind: Ingress
