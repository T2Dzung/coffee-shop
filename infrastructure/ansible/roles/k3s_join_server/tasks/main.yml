---
- name: Create K3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: '0755'

- name: Deploy K3s configuration (Join)
  ansible.builtin.template:
    src: ../../../templates/k3s-config.yaml.j2  # noqa no-relative-paths
    dest: /etc/rancher/k3s/config.yaml
    mode: '0600'
  vars:
    is_bootstrap: false

- name: Read K3s token from Bootstrap Node
  delegate_to: "{{ groups['k3s_bootstrap_server'][0] }}"
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_join_server_token_slurp
  no_log: true

- name: Install K3s (Join)
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | sh -
  args:
    executable: /bin/bash
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "server"
    K3S_TOKEN: "{{ k3s_join_server_token_slurp.content | b64decode | trim }}"
  register: k3s_join_server_install
  changed_when: "'No change' not in k3s_join_server_install.stdout"

- name: Create kube directory for ubuntu user
  ansible.builtin.file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0700'

- name: Copy K3s kubeconfig to user's kube config directory
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /home/ubuntu/.kube/config
    remote_src: true
    owner: ubuntu
    group: ubuntu
    mode: '0600'

- name: Add KUBECONFIG env to .bashrc
  ansible.builtin.lineinfile:
    path: /home/ubuntu/.bashrc
    line: 'export KUBECONFIG=/home/ubuntu/.kube/config'
    state: present
