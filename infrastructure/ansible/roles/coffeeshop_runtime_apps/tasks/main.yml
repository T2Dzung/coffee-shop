---
- name: Wait for CoffeeShop PostgreSQL to accept runtime dependencies
  kubernetes.core.k8s_info:
    kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/coffeeshop-dev.yaml"
    api_version: postgresql.cnpg.io/v1
    kind: Cluster
    name: coffeeshop-postgres
    namespace: coffeeshop
    wait: true
    wait_timeout: 900
    wait_condition:
      type: Ready
      status: "True"
  delegate_to: localhost
  run_once: true

- name: Wait for all CoffeeShop RabbitMQ replicas
  kubernetes.core.k8s_info:
    kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/coffeeshop-dev.yaml"
    api_version: rabbitmq.com/v1beta1
    kind: RabbitmqCluster
    name: coffeeshop-rabbitmq
    namespace: coffeeshop
    wait: true
    wait_timeout: 900
    wait_condition:
      type: AllReplicasReady
      status: "True"
  delegate_to: localhost
  run_once: true

- name: Apply runtime App-of-Apps after data dependencies are ready
  kubernetes.core.k8s:
    kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/coffeeshop-dev.yaml"
    state: present
    definition: >-
      {{
        lookup(
          'file',
          playbook_dir + '/../../k8s/environments/dev/bootstrap/runtime-root-app.yaml'
        )
        | from_yaml
      }}
  delegate_to: localhost
  run_once: true

- name: Wait for runtime ArgoCD applications to be materialized
  kubernetes.core.k8s_info:
    kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/coffeeshop-dev.yaml"
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: "{{ item }}"
    namespace: argocd
  register: coffeeshop_runtime_apps_application
  until: coffeeshop_runtime_apps_application.resources | length == 1
  retries: 60
  delay: 10
  loop:
    - coffeeshop-dev
    - platform-ownership-guard
  delegate_to: localhost
  run_once: true
