---
- name: Ensure CoffeeShop namespace exists for Gateway resources
  kubernetes.core.k8s:
    kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/coffeeshop-dev.yaml"
    name: coffeeshop
    api_version: v1
    kind: Namespace
    state: present
  delegate_to: localhost
  run_once: true

- name: Apply CoffeeShop Gateway API resources
  kubernetes.core.k8s:
    kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/coffeeshop-dev.yaml"
    state: present
    src: "{{ playbook_dir }}/../../k8s/environments/dev/network/gateway/{{ item }}"
  loop:
    - gateway.yaml
    - httproute.yaml
    - smoke.yaml
  delegate_to: localhost
  run_once: true

- name: Wait for gateway smoke deployment to be available
  kubernetes.core.k8s_info:
    kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/coffeeshop-dev.yaml"
    api_version: apps/v1
    kind: Deployment
    name: gateway-smoke
    namespace: coffeeshop
  register: gateway_resources_smoke_deployment
  until: >
    gateway_resources_smoke_deployment.resources | length == 1 and
    gateway_resources_smoke_deployment.resources[0].status.readyReplicas | default(0) ==
    gateway_resources_smoke_deployment.resources[0].spec.replicas | default(1)
  retries: 30
  delay: 10
  delegate_to: localhost
  run_once: true
