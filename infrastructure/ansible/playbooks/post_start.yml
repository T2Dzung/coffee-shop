---
- name: Recover HAProxy
  hosts: haproxy
  become: true
  tasks:
    - name: Ensure HAProxy is running
      ansible.builtin.systemd:
        name: haproxy
        state: started

- name: Recover K3s Servers
  hosts: k3s_servers
  become: true
  serial: 1
  tasks:
    - name: Refresh ECR credentials through the managed systemd service
      ansible.builtin.systemd:
        name: refresh-ecr-token.service
        state: started
      no_log: true

    - name: Ensure the K3s server is running
      ansible.builtin.systemd:
        name: k3s
        state: started

- name: Verify cluster
  hosts: k3s_bootstrap_server
  become: true
  tasks:
    - name: Verify K3s cluster nodes
      ansible.builtin.command: kubectl get nodes
      register: nodes_output
      changed_when: false
      retries: 12
      delay: 10
      until: nodes_output.rc == 0

    - name: Print cluster node status
      ansible.builtin.debug:
        var: nodes_output.stdout_lines
