plugin: aws_ec2
# Region is inherited from AWS_DEFAULT_REGION/AWS_PROFILE so Terraform and
# dynamic inventory cannot silently target different regions.
filters:
  tag:Environment: dev
  tag:ManagedBy: Terraform
  instance-state-name: [running]
hostnames:
  - ip-address
strict: false
groups:
  k3s_servers: ec2_tags.K8sRole == 'server'
  haproxy: ec2_tags.K8sRole == 'haproxy'
  k3s_bootstrap_server: ec2_tags.K3sBootstrap == 'true'
  k3s_join_servers: ec2_tags.K3sBootstrap == 'false'
  nfs_server: ec2_tags.NfsRole == 'server'
  nfs_clients: ec2_tags.NfsRole == 'client'
compose:
  # Use private IP inside cluster communication
  private_ip: private_ip_address
