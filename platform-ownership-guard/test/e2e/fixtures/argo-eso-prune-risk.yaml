apiVersion: v1
kind: Namespace
metadata:
  name: argocd
---
apiVersion: v1
kind: Namespace
metadata:
  name: coffeeshop
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prune-candidate
  namespace: coffeeshop
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eso-prune-app
  namespace: argocd
spec:
  syncPolicy:
    automated:
      prune: true
status:
  reconciledAt: "2000-01-01T00:00:00Z"
  sync:
    status: Synced
  resources:
    - group: external-secrets.io
      version: v1
      kind: ExternalSecret
      namespace: coffeeshop
      name: prune-candidate
      requiresPruning: true
---
apiVersion: guard.platform.t2dzung.github.io/v1alpha1
kind: OwnershipAudit
metadata:
  name: eso-prune-risk
  namespace: coffeeshop
spec:
  applicationRefs:
    - namespace: argocd
      name: eso-prune-app
  detectors:
    - ArgoPruneRisk
  targetRules:
    - apiGroup: external-secrets.io
      version: v1
      kind: ExternalSecret
  resyncInterval: 5m
