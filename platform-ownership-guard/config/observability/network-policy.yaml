apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-ownership-guard-ingress-policy
  namespace: platform-ownership-guard-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: platform-ownership-guard
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
