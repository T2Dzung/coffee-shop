apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-ownership-guard-rules
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    release: monitoring
    role: alert-rules
spec:
  groups:
    - name: platform-ownership-guard.rules
      rules:
        - alert: PlatformOwnershipGuardHighFindingDetected
          expr: sum(increase(platform_ownership_guard_finding_transitions_total{severity="High", transition=~"added|changed"}[5m])) > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High severity ownership finding detected in cluster"
            description: "PlatformOwnershipGuard detected a new or elevated High severity finding in the last 5 minutes."

        - alert: PlatformOwnershipGuardInventoryDegraded
          expr: sum(rate(platform_ownership_guard_inventory_errors_total[10m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PlatformOwnershipGuard inventory collection degraded"
            description: "PlatformOwnershipGuard experienced repeated inventory collection errors over the last 10 minutes."
