apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - service.yaml
  - service-monitor.yaml
  - network-policy.yaml
  - prometheus-rules.yaml

configMapGenerator:
  - name: platform-ownership-guard-dashboard
    namespace: monitoring
    files:
      - platform-ownership-guard-dashboard.json=grafana-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        argocd.argoproj.io/sync-wave: "1"
