groups:
  - name: platform-ownership-guard.rules
    rules:
      - alert: PlatformOwnershipGuardHighFindingDetected
        expr: sum(increase(platform_ownership_guard_finding_transitions_total{severity="High", transition=~"added|changed"}[10m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High severity ownership finding detected in cluster"
          description: "PlatformOwnershipGuard detected a new or elevated High severity finding in the last 10 minutes."

      - alert: PlatformOwnershipGuardInventoryDegraded
        expr: sum(increase(platform_ownership_guard_inventory_errors_total{reason=~"EvidenceForbidden|TransientReadFailure"}[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PlatformOwnershipGuard inventory collection degraded"
          description: "PlatformOwnershipGuard observed forbidden or transient inventory evidence in the last 15 minutes."
