---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: ownershipaudits.guard.platform.t2dzung.github.io
spec:
  group: guard.platform.t2dzung.github.io
  names:
    kind: OwnershipAudit
    listKind: OwnershipAuditList
    plural: ownershipaudits
    singular: ownershipaudit
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.summary.totalFindings
      name: Findings
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: OwnershipAudit is the Schema for the ownershipaudits API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OwnershipAuditSpec defines the desired audit scope and cadence.
            properties:
              applicationRefs:
                description: ApplicationRefs are explicit Argo CD Applications used
                  as ownership evidence.
                items:
                  description: ApplicationReference identifies one explicitly selected
                    Argo CD Application.
                  properties:
                    name:
                      description: Name is the Kubernetes name of the Application.
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                      type: string
                    namespace:
                      description: Namespace is required because Applications may
                        live outside the audit namespace.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                maxItems: 20
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - namespace
                - name
                x-kubernetes-list-type: map
              detectors:
                description: Detectors enables only rules compiled into this guard
                  version.
                items:
                  description: |-
                    DetectorType identifies a detector implemented by the guard binary.
                    Phase 6.4 defines the public API values; Phase 6.5 implements their rules.
                  enum:
                  - ArgoPruneRisk
                  - StaleOwnerReference
                  type: string
                maxItems: 2
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              resyncInterval:
                default: 10m
                description: ResyncInterval bounds eventual re-audit and optional
                  API rediscovery.
                type: string
                x-kubernetes-validations:
                - message: resyncInterval must be between 5m and 24h
                  rule: duration(self) >= duration('5m') && duration(self) <= duration('24h')
              targetRules:
                description: |-
                  TargetRules is an explicit GVK allowlist within the audit namespace.
                  Runtime support is additionally constrained by the binary and its RBAC.
                items:
                  description: |-
                    TargetRule selects one explicit Group/Version/Kind supported by the guard binary.
                    Core resources use an empty APIGroup. Wildcards are forbidden.
                  properties:
                    apiGroup:
                      maxLength: 253
                      pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                    kind:
                      maxLength: 63
                      minLength: 1
                      pattern: ^[A-Za-z][A-Za-z0-9]*$
                      type: string
                    version:
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z][a-z0-9]*$
                      type: string
                  required:
                  - apiGroup
                  - kind
                  - version
                  type: object
                maxItems: 32
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - apiGroup
                - version
                - kind
                x-kubernetes-list-type: map
            required:
            - applicationRefs
            - detectors
            - targetRules
            type: object
          status:
            description: OwnershipAuditStatus defines the current bounded observation
              reported by the guard.
            properties:
              conditions:
                description: Conditions contains at most Ready and InventoryReady.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 2
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              findings:
                description: Findings contains the deterministic highest-priority
                  bounded result set.
                items:
                  description: OwnershipFinding is one deterministic, bounded current
                    finding.
                  properties:
                    confidence:
                      description: FindingConfidence describes how completely available
                        evidence supports a finding.
                      enum:
                      - Confirmed
                      - Suspected
                      - InsufficientEvidence
                      type: string
                    detector:
                      description: |-
                        DetectorType identifies a detector implemented by the guard binary.
                        Phase 6.4 defines the public API values; Phase 6.5 implements their rules.
                      enum:
                      - ArgoPruneRisk
                      - StaleOwnerReference
                      type: string
                    evidenceSummary:
                      description: EvidenceSummary contains sanitized evidence, never
                        a raw object or Secret value.
                      maxLength: 512
                      minLength: 1
                      type: string
                    id:
                      description: ID is stable across equivalent reconciliations
                        and excludes timestamps.
                      maxLength: 128
                      minLength: 1
                      type: string
                    missingEvidence:
                      description: MissingEvidence lists bounded facts required to
                        raise confidence.
                      items:
                        description: MissingEvidence is one bounded description of
                          evidence unavailable to a detector.
                        maxLength: 128
                        minLength: 1
                        type: string
                      maxItems: 8
                      type: array
                      x-kubernetes-list-type: set
                    remediation:
                      description: Remediation is human guidance; the guard does not
                        apply it.
                      maxLength: 1024
                      minLength: 1
                      type: string
                    severity:
                      description: FindingSeverity describes potential operational
                        impact independently of confidence.
                      enum:
                      - Info
                      - Warning
                      - High
                      type: string
                    target:
                      description: ResourceReference is a bounded identity; it never
                        embeds the target object.
                      properties:
                        apiGroup:
                          maxLength: 253
                          type: string
                        kind:
                          maxLength: 63
                          minLength: 1
                          type: string
                        name:
                          maxLength: 253
                          minLength: 1
                          type: string
                        namespace:
                          maxLength: 63
                          minLength: 1
                          type: string
                        uid:
                          description: UID is present when live evidence resolved
                            the exact object identity.
                          type: string
                        version:
                          maxLength: 63
                          minLength: 1
                          type: string
                      required:
                      - apiGroup
                      - kind
                      - name
                      - namespace
                      - version
                      type: object
                  required:
                  - confidence
                  - detector
                  - evidenceSummary
                  - id
                  - remediation
                  - severity
                  - target
                  type: object
                maxItems: 100
                type: array
                x-kubernetes-list-map-keys:
                - id
                x-kubernetes-list-type: map
              lastCompletedScanTime:
                description: LastCompletedScanTime is a bounded scheduled-scan heartbeat,
                  not an event-reconcile timestamp.
                format: date-time
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the spec generation represented by this status outcome.
                  It may advance when Ready is false if the failure has been classified and persisted.
                format: int64
                minimum: 0
                type: integer
              summary:
                description: AuditSummary stores bounded aggregate counts.
                properties:
                  confirmed:
                    format: int32
                    minimum: 0
                    type: integer
                  insufficientEvidence:
                    format: int32
                    minimum: 0
                    type: integer
                  suspected:
                    format: int32
                    minimum: 0
                    type: integer
                  totalFindings:
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              truncatedFindings:
                description: TruncatedFindings reports current findings omitted by
                  the 100-item status budget.
                format: int32
                minimum: 0
                type: integer
            type: object
            x-kubernetes-validations:
            - message: condition messages must not exceed 512 characters
              rule: '!has(self.conditions) || self.conditions.all(c, size(c.message)
                <= 512)'
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
