apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# PROD reuses the controller/RBAC/CRD base but deliberately excludes DEV's
# Prometheus/Grafana bundle. The audit observes both PROD Argo applications.
resources:
- ../default
- ../samples

patches:
- patch: |-
    - op: replace
      path: /metadata/namespace
      value: coffeeshop
    - op: replace
      path: /spec/applicationRefs
      value:
        - namespace: argocd
          name: coffeeshop-prod
        - namespace: argocd
          name: coffeeshop-prod-platform
  target:
    group: guard.platform.t2dzung.github.io
    kind: OwnershipAudit
    name: coffeeshop-ownership
    version: v1alpha1

images:
- digest: sha256:38f8c70be8c79f82932fc8e45108fef3312b5192bfa8e4ee8048293ee93a30b6
  name: controller
  newName: 694637278772.dkr.ecr.ap-southeast-1.amazonaws.com/platform-ownership-guard
