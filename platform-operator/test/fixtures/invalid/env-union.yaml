apiVersion: platform.t2dzung.github.io/v1alpha1
kind: CoffeeShopService
metadata:
  name: invalid-env-union
  namespace: default
spec:
  managementPolicy: Observe
  image:
    repository: registry.example/web
    tag: v1
  replicas: 1
  env:
    - name: WEB_PORT
      value: "8888"
      valueFrom:
        configMapKeyRef:
          name: coffeeshop-config
          key: WEB_PORT
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 250m, memory: 128Mi}
