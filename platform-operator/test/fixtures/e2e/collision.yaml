apiVersion: apps/v1
kind: Deployment
metadata:
  name: phase62-collision
  namespace: platform-operator-e2e
  annotations:
    example.com/owner: external-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: external-collision
  template:
    metadata:
      labels:
        app: external-collision
    spec:
      containers:
        - name: external
          image: nginx:1.27.4
---
apiVersion: platform.t2dzung.github.io/v1alpha1
kind: CoffeeShopService
metadata:
  name: phase62-collision
  namespace: platform-operator-e2e
spec:
  managementPolicy: Manage
  adoptionPolicy: Never
  image:
    repository: nginx
    tag: 1.27.4
    pullPolicy: IfNotPresent
  replicas: 1
  ports:
    - name: http
      containerPort: 80
  service:
    enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi
