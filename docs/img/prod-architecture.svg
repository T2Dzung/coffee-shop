Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start"><tspan x="1115" y="256">PostgreSQL</tspan><tspan x="1115" y="278.5">DB subnet group</tspan></text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="1055" y="330">Two private subnets</tspan><tspan x="1055" y="348.75">Encrypted · TLS role</tspan><tspan x="1055" y="367.5">Single-AZ · 7-day backups</tspan></text><rect x="325" y="485" width="310" height="145" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text fill="#5b21b6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start"><tspan x="347" y="525">IDENTITY + SECRETS</tspan></text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="347" y="565">Secrets Manager → ESO</tspan><tspan x="347" y="583.75">EKS Pod Identity per controller</tspan><tspan x="347" y="602.5">Pods use generated K8s Secrets</tspan></text><rect x="670" y="485" width="315" height="145" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text fill="#5b21b6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start"><tspan x="692" y="525">GITOPS + CONTROLLERS</tspan></text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="692" y="565">Argo CD · AWS LB Controller</tspan><tspan x="692" y="583.75">ESO · EBS CSI · RabbitMQ Operator</tspan><tspan x="692" y="602.5">OwnershipGuard · read-only audit</tspan></text><rect x="1020" y="485" width="335" height="145" rx="16" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text fill="#5b21b6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start"><tspan x="1042" y="525">AWS OPERATIONS</tspan></text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="1042" y="565">CloudWatch Container Insights</tspan><tspan x="1042" y="583.75">Application and control-plane logs</tspan><tspan x="1042" y="602.5">Alarms · private Argo CD access</tspan></text><rect x="325" y="665" width="1030" height="60" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle"><tspan x="840" y="698">EKS spans two AZs; the current cost-bounded RDS database remains Single-AZ</tspan></text><rect x="35" y="470" width="225" height="190" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start"><tspan x="55" y="506">FLOW LEGEND</tspan></text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="78" y="547">Request / service</tspan><tspan x="78" y="564.5">State / data</tspan><tspan x="78" y="582">Control / telemetry</tspan><tspan x="78" y="599.5"></tspan><tspan x="78" y="617">Managed AWS boundary</tspan></text><polyline points="52,543 70,543" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="52,569 70,569" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="52,595 70,595" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/><polyline points="260,300 290,300 290,310 325,310" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-2563eb)"/><polyline points="550,310 590,310" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-2563eb)"/><polyline points="990,310 1030,310" fill="none" stroke="#059669" stroke-wi