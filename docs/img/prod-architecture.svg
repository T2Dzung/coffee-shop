  <text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="start"><tspan x="40" y="58">PROD · AWS-managed production-like environment</tspan></text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start"><tspan x="42" y="93">Internet-facing ALB · private EKS nodes across two AZs · private encrypted RDS</tspan></text><rect x="35" y="180" width="225" height="240" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text fill="#1e40af" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start"><tspan x="55" y="216">PUBLIC TRAFFIC</tspan></text><ellipse cx="89" cy="274" rx="24" ry="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text fill="#1d4ed8" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle"><tspan x="89" y="279">U</tspan></text><text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start"><tspan x="125" y="270">User / API</tspan><tspan x="125" y="291.25">client</tspan></text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle"><tspan x="148" y="350">HTTP :80</tspan><tspan x="148" y="368.75">Dynamic ALB hostname</tspan><tspan x="148" y="387.5">No custom domain / ACM</tspan></text><rect x="290" y="125" width="1115" height="625" rx="24" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/><text fill="#1e40af" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start"><tspan x="320" y="169">AWS VPC · PUBLIC + PRIVATE SUBNET BOUNDARIES</tspan></text><rect x="325" y="215" width="225" height="190" rx="16" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/><ellipse cx="370" cy="259" rx="23" ry="23" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text fill="#1d4ed8" font-family="Arial, Helvetica, sans-serif" fon