<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
  <title id="title">CoffeeShop Platform delivery flow</title>
  <desc id="desc">Protected source, immutable candidate, DEV delivery, manual QA and automatic PROD GitOps flow.</desc>
  <defs><marker id="arrow-2563eb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs>
  <rect width="1440" height="780" fill="#f8fafc"/>
  <text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="start"><tspan x="40" y="58">Source → DEV → manual QA → PROD</tspan></text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start"><tspan x="42" y="93">One immutable digest · protected Git records every desired-state transition</tspan></text><rect x="30" y="145" width="750" height="390" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start"><tspan x="50" y="182">PROTECTED SOURCE + CANDIDATE</tspan></text><rect x="790" y="145" width="185" height="390" rx="20" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/><text fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start"><tspan x="810" y="182">DEV</tspan></text><rect x="985" y="145" width="185" height="390" rx="20" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><text fill="#6d28d9" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start"><tspan x="1005" y="182">QA DECISION</tspan></text><rect x="1180" y="145" width="230" height="390" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text fill="#1d4ed8" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start"><tspan x="1200" y="182">PROD</tspan></text><rect x="50" y="215" width="165" height="270" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><rect x="68" y="235" width="74" height="30" rx="16" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/><text fill="#6d28d9" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle"><tspan x="105" y="255">MANUAL</tspan></text><text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start"><tspan x="68" y="308">Feature PR</tspan></text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="68" y="354">Contributor opens</tspan><tspan x="68" y="371.5">application or</tspan><tspan x="68" y="389">platform change</tspan><tspan x="68" y="406.5"></tspan><tspan x="68" y="424">No trusted runner</tspan><tspan x="68" y="441.5">credentials</tspan></text><rect x="235" y="215" width="165" height="270" rx="16" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/><rect x="253" y="235" width="56" height="30" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/><text fill="#1d4ed8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle"><tspan x="281" y="255">AUTO</tspan></text><text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start"><tspan x="253" y="308">Required</tspan><tspan x="253" y="330.5">checks</tspan></text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="253" y="369">CI Status</tspan><tspan x="253" y="386.5">DevSecOps Status</tspan><tspan x="253" y="404">Policy and render</tspan><tspan x="253" y="421.5">validation</tspan></text><rect x="420" y="215" width="165" height="270" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><rect x="438" y="235" width="74" height="30" rx="16" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/><text fill="#6d28d9" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle"><tspan x="475" y="255">MANUAL</tspan></text><text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start"><tspan x="438" y="308">Protected</tspan><tspan x="438" y="330.5">merge</tspan></text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="438" y="369">Human review</tspan><tspan x="438" y="386.5">Required checks</tspan><tspan x="438" y="404">Protected main</tspan><tspan x="438" y="421.5">branch</tspan></text><rect x="605" y="215" width="165" height="270" rx="16" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/><rect x="623" y="235" width="56" height="30" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/><text fill="#1d4ed8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle"><tspan x="651" y="255">AUTO</tspan></text><text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start"><tspan x="623" y="308">Immutable</tspan><tspan x="623" y="330.5">candidate</tspan></text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="623" y="369">Build · Trivy</tspan><tspan x="623" y="386.5">SBOM · Cosign</tspan><tspan x="623" y="404">Exact digest</tspan><tspan x="623" y="421.5">Evidence PR</tspan></text><rect x="800" y="215" width="165" height="270" rx="16" fill="#ffffff" stroke="#34d399" stroke-width="2"/><rect x="818" y="235" width="56" height="30" rx="16" fill="#d1fae5" stroke="#10b981" stroke-width="1"/><text fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle"><tspan x="846" y="255">AUTO</tspan></text><text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start"><tspan x="818" y="308">DEV GitOps</tspan></text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="818" y="354">Copy exact digest</tspan><tspan x="818" y="371.5">Desired-state PR</tspan><tspan x="818" y="389">Auto-merge checks</tspan><tspan x="818" y="406.5">Argo CD sync</tspan><tspan x="818" y="424">Runtime QA target</tspan></text><rect x="995" y="215" width="165" height="270" rx="16" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/><rect x="1013" y="235" width="74" height="30" rx="16" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/><text fill="#6d28d9" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle"><tspan x="1050" y="255">MANUAL</tspan></text><text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start"><tspan x="1013" y="308">Approve or</tspan><tspan x="1013" y="330.5">reject</tspan></text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="1013" y="369">Exact source</tspan><tspan x="1013" y="386.5">Release set</tspan><tspan x="1013" y="404">DEV evidence</tspan><tspan x="1013" y="421.5">One decision</tspan></text><rect x="1190" y="215" width="205" height="270" rx="16" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/><rect x="1208" y="235" width="56" height="30" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/><text fill="#1d4ed8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle"><tspan x="1236" y="255">AUTO</tspan></text><text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start"><tspan x="1208" y="308">PROD GitOps</tspan></text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="1208" y="354">Verify + re-scan</tspan><tspan x="1208" y="371.5">Copy approved digest</tspan><tspan x="1208" y="389">Atomic desired-state PR</tspan><tspan x="1208" y="406.5">Argo platform → app</tspan><tspan x="1208" y="424">reconciliation</tspan></text><polyline points="215,350 235,350" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-2563eb)"/><polyline points="400,350 420,350" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-2563eb)"/><polyline points="585,350 605,350" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-2563eb)"/><polyline points="770,350 800,350" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-2563eb)"/><polyline points="965,350 995,350" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-2563eb)"/><polyline points="1160,350 1190,350" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-2563eb)"/><rect x="40" y="580" width="1360" height="75" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/><text fill="#1e40af" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start"><tspan x="65" y="616">ARTIFACT IDENTITY</tspan></text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="290" y="616">The same approved digest is copied between registries; environments change desired state, never rebuild the release.</tspan></text><rect x="40" y="685" width="1360" height="65" rx="16" fill="#fff1f2" stroke="#fb7185" stroke-width="2" stroke-dasharray="9 7"/><text fill="#9f1239" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle"><tspan x="720" y="719">MANUAL EXCEPTION · emergency and rollback remain bounded paths and must reconcile the exact digest back through protected Git</tspan></text>
</svg>
