<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
  <title id="title">CoffeeShop DEV architecture</title>
  <desc id="desc">Self-managed K3s request, workload, state, GitOps and observability boundaries.</desc>
  <defs><marker id="arrow-059669" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#059669"/></marker><marker id="arrow-2563eb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><marker id="arrow-7c3aed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker></defs>
  <rect width="1440" height="780" fill="#f8fafc"/>
  <text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="start"><tspan x="40" y="58">DEV · self-managed Kubernetes</tspan></text><text fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start"><tspan x="42" y="93">On-prem simulation on EC2 · three K3s control-plane nodes · embedded etcd</tspan></text><rect x="35" y="155" width="225" height="285" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text fill="#1e40af" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start"><tspan x="55" y="191">PUBLIC ENTRY</tspan></text><ellipse cx="89" cy="244" rx="24" ry="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text fill="#1d4ed8" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle"><tspan x="89" y="249">U</tspan></text><text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start"><tspan x="125" y="240">User / API</tspan><tspan x="125" y="261.25">client</tspan></text><rect x="58" y="305" width="178" height="100" rx="16" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/><text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="147" y="334">Elastic IP</tspan><tspan x="147" y="354">HAProxy</tspan><tspan x="147" y="374">active endpoint</tspan></text><rect x="295" y="125" width="1110" height="625" rx="24" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/><text fill="#065f46" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start"><tspan x="325" y="169">K3S CLUSTER · CONTROL PLANE + WORKLOADS</tspan></text><rect x="330" y="205" width="245" height="195" rx="16" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/><ellipse cx="373" cy="249" rx="23" ry="23" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text fill="#0e7490" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="373" y="254">GW</tspan></text><text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start"><tspan x="408" y="246">Cilium + Envoy</tspan><tspan x="408" y="268.5">Gateway API</tspan></text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="352" y="315">eBPF data plane</tspan><tspan x="352" y="333.75">/ → web · /api → proxy</tspan><tspan x="352" y="352.5">Default deny + allow policies</tspan></text><rect x="615" y="205" width="345" height="195" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><ellipse cx="661" cy="249" rx="23" ry="23" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="661" y="254">APP</tspan></text><text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start"><tspan x="700" y="251">CoffeeShop services</tspan></text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="640" y="315">web → proxy → product + counter</tspan><tspan x="640" y="333.75">counter → PostgreSQL + RabbitMQ</tspan><tspan x="640" y="352.5">RabbitMQ → barista + kitchen</tspan><tspan x="640" y="371.25">HPA owns proxy/product replicas</tspan></text><rect x="1000" y="205" width="355" height="195" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="2"/><ellipse cx="1045" cy="249" rx="23" ry="23" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="1045" y="254">DB</tspan></text><text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start"><tspan x="1085" y="251">Operator-managed state</tspan></text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="1025" y="315">CloudNativePG · 3 instances</tspan><tspan x="1025" y="333.75">RabbitMQ Operator · 3 replicas</tspan><tspan x="1025" y="352.5">Longhorn · one volume replica / Pod</tspan></text><rect x="330" y="465" width="300" height="145" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text fill="#5b21b6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start"><tspan x="352" y="505">GITOPS + CONTROL</tspan></text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="352" y="545">Argo CD App-of-Apps</tspan><tspan x="352" y="563.75">OwnershipGuard · read-only audit</tspan><tspan x="352" y="582.5">cert-manager installed</tspan></text><rect x="665" y="465" width="340" height="145" rx="16" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text fill="#5b21b6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start"><tspan x="687" y="505">OBSERVABILITY</tspan></text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="687" y="545">Prometheus + Alertmanager</tspan><tspan x="687" y="563.75">Alloy → Loki · OTel → Tempo</tspan><tspan x="687" y="582.5">Grafana correlates all signals</tspan></text><rect x="1040" y="465" width="315" height="145" rx="16" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text fill="#3730a3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start"><tspan x="1062" y="505">PRIVATE OPERATIONS</tspan></text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start"><tspan x="1062" y="545">Grafana + Argo CD via port-forward</tspan><tspan x="1062" y="563.75">Public application remains HTTP</tspan><tspan x="1062" y="582.5">No public Certificate yet</tspan></text><rect x="330" y="655" width="1025" height="65" rx="16" fill="#ffffff" stroke="#6ee7b7" stroke-width="1"/><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="middle"><tspan x="842.5" y="690">HA at the K3s, PostgreSQL and RabbitMQ layers · application and admin endpoints use different exposure boundaries</tspan></text><rect x="35" y="485" width="225" height="190" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start"><tspan x="55" y="521">FLOW LEGEND</tspan></text><text fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="78" y="562">Request / service</tspan><tspan x="78" y="579.5">State / data</tspan><tspan x="78" y="597">Control / telemetry</tspan><tspan x="78" y="614.5"></tspan><tspan x="78" y="632">Admin access is private</tspan></text><polyline points="52,558 70,558" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="52,584 70,584" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="52,610 70,610" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/><polyline points="89,270 89,288 147,288 147,305" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-2563eb)"/><polyline points="236,350 266,350 266,305 330,305" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-2563eb)"/><polyline points="575,302 615,302" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-2563eb)"/><polyline points="960,302 1000,302" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-059669)"/><polyline points="480,465 480,435 787,435 787,400" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#arrow-7c3aed)"/><polyline points="835,400 835,465" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#arrow-7c3aed)"/>
</svg>
