name: Verify candidate supply chain
description: Scan, generate SBOM, sign, and verify one exact candidate digest

inputs:
  component:
    required: true
  image:
    required: true
  digest:
    required: true

runs:
  using: composite
  steps:
    - name: Scan exact candidate digest
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        version: v0.72.0
        image-ref: ${{ inputs.image }}@${{ inputs.digest }}
        format: table
        exit-code: "1"
        ignore-unfixed: true
        vuln-type: os,library
        severity: CRITICAL
        cache: "true"

    - name: Generate SPDX SBOM
      uses: anchore/sbom-action@cee1b8e05c7b3a80d97a6f79b1a68a5c870ecb51 # v0.20.4
      with:
        image: ${{ inputs.image }}@${{ inputs.digest }}
        format: spdx-json
        output-file: ${{ runner.temp }}/${{ inputs.component }}-sbom.spdx.json

    - name: Upload SBOM
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ inputs.component }}-sbom-${{ github.sha }}
        path: ${{ runner.temp }}/${{ inputs.component }}-sbom.spdx.json
        retention-days: 14

    - name: Install Cosign
      uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

    - name: Sign and verify exact digest
      shell: bash
      env:
        ARTIFACT: ${{ inputs.image }}@${{ inputs.digest }}
      run: |
        set -Eeuo pipefail
        identity="https://github.com/${GITHUB_WORKFLOW_REF}"
        if ! cosign verify \
          --certificate-identity "${identity}" \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          "${ARTIFACT}" >/dev/null 2>&1; then
          cosign sign --yes "${ARTIFACT}"
        fi
        cosign verify \
          --certificate-identity "${identity}" \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          "${ARTIFACT}"
