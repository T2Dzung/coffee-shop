name: Build immutable component
description: Build and push one catalog-owned candidate artifact

inputs:
  component:
    required: true
    description: Component catalog name
  source-commit:
    required: true
    description: Full protected source commit
  registry:
    required: true
    description: Authenticated candidate ECR registry
  platformctl:
    required: true
    description: Absolute platformctl path
  use-hosted-cache:
    required: false
    default: "false"
    description: Use GitHub-hosted Go and BuildKit caches; keep false on ARC

outputs:
  image:
    value: ${{ steps.artifact.outputs.image }}
    description: Candidate image repository
  digest:
    value: ${{ steps.artifact.outputs.digest }}
    description: Registry sha256 digest
  kind:
    value: ${{ steps.metadata.outputs.kind }}
    description: Catalog component kind
  dev-overlay:
    value: ${{ steps.metadata.outputs.dev_overlay }}
    description: DEV desired-state overlay
  prod-overlay:
    value: ${{ steps.metadata.outputs.prod_overlay }}
    description: PROD desired-state overlay
  kustomize-image:
    value: ${{ steps.metadata.outputs.kustomize_image }}
    description: Kustomize image key

runs:
  using: composite
  steps:
    - name: Resolve catalog metadata
      id: metadata
      shell: bash
      env:
        PLATFORMCTL: ${{ inputs.platformctl }}
        COMPONENT: ${{ inputs.component }}
      run: |
        set -Eeuo pipefail
        "${PLATFORMCTL}" component describe --name "${COMPONENT}" >"${RUNNER_TEMP}/component.json"
        for field in kind module_root package binary context dockerfile image_repository dev_overlay prod_overlay kustomize_image; do
          value="$(jq -er --arg field "${field}" '.[$field]' "${RUNNER_TEMP}/component.json")"
          echo "${field}=${value}" >>"${GITHUB_OUTPUT}"
        done
        candidate_repository="$("${PLATFORMCTL}" component candidate-repositories --names "${COMPONENT}" | jq -er '.[0]')"
        echo "candidate_repository=${candidate_repository}" >>"${GITHUB_OUTPUT}"

    - name: Resolve existing immutable candidate
      id: existing
      shell: bash
      env:
        SOURCE_COMMIT: ${{ inputs.source-commit }}
        REGISTRY: ${{ inputs.registry }}
        CANDIDATE_REPOSITORY: ${{ steps.metadata.outputs.candidate_repository }}
      run: |
        set -Eeuo pipefail
        [[ "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
        image="${REGISTRY}/${CANDIDATE_REPOSITORY}"
        tag="candidate-${SOURCE_COMMIT}"
        manifest="$(docker buildx imagetools inspect "${image}:${tag}" \
          --format '{{json .Manifest}}' 2>/dev/null || true)"
        digest="$(jq -er '.digest // empty' <<<"${manifest}" 2>/dev/null || true)"
        if [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "digest=${digest}" >>"${GITHUB_OUTPUT}"
        else
          echo "digest=" >>"${GITHUB_OUTPUT}"
        fi

    - name: Restore nested module cache on GitHub-hosted runner
      if: >-
        inputs.use-hosted-cache == 'true' &&
        steps.metadata.outputs.module_root != '.' &&
        steps.existing.outputs.digest == ''
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: ${{ steps.metadata.outputs.module_root }}/go.mod
        cache: true
        cache-dependency-path: ${{ steps.metadata.outputs.module_root }}/go.sum

    - name: Build release binary
      if: steps.existing.outputs.digest == ''
      shell: bash
      env:
        MODULE_ROOT: ${{ steps.metadata.outputs.module_root }}
        PACKAGE: ${{ steps.metadata.outputs.package }}
        BINARY: ${{ steps.metadata.outputs.binary }}
      run: |
        set -Eeuo pipefail
        (
          cd "${MODULE_ROOT}"
          mkdir -p "$(dirname "${BINARY}")"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -mod=readonly -trimpath -ldflags="-s -w" -o "${BINARY}" "${PACKAGE}"
        )

    - name: Build and push immutable candidate
      id: artifact
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
        SOURCE_COMMIT: ${{ inputs.source-commit }}
        REGISTRY: ${{ inputs.registry }}
        CONTEXT: ${{ steps.metadata.outputs.context }}
        DOCKERFILE: ${{ steps.metadata.outputs.dockerfile }}
        CANDIDATE_REPOSITORY: ${{ steps.metadata.outputs.candidate_repository }}
        EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
        USE_HOSTED_CACHE: ${{ inputs.use-hosted-cache }}
      run: |
        set -Eeuo pipefail
        [[ "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
        image="${REGISTRY}/${CANDIDATE_REPOSITORY}"
        tag="candidate-${SOURCE_COMMIT}"
        if [[ "${EXISTING_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          digest="${EXISTING_DIGEST}"
        else
          metadata_file="${RUNNER_TEMP}/buildx-${COMPONENT}.json"
          cache_args=()
          if [[ "${USE_HOSTED_CACHE}" == "true" ]]; then
            cache_args+=(
              --cache-from "type=gha,scope=candidate-${COMPONENT}"
              --cache-to "type=gha,mode=max,scope=candidate-${COMPONENT}"
            )
          fi
          docker buildx build --platform linux/amd64 --push \
            "${cache_args[@]}" \
            --metadata-file "${metadata_file}" \
            --file "${DOCKERFILE}" --tag "${image}:${tag}" "${CONTEXT}"
          digest="$(jq -er '."containerimage.digest"' "${metadata_file}")"
        fi
        [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
        echo "image=${image}" >>"${GITHUB_OUTPUT}"
        echo "digest=${digest}" >>"${GITHUB_OUTPUT}"
