name: Build immutable component
description: Build and push one catalog-owned candidate artifact

inputs:
  component:
    required: true
    description: Component catalog name
  source-commit:
    required: true
    description: Full protected source commit
  registry:
    required: true
    description: Authenticated candidate ECR registry
  platformctl:
    required: true
    description: Absolute platformctl path

outputs:
  image:
    value: ${{ steps.artifact.outputs.image }}
    description: Candidate image repository
  digest:
    value: ${{ steps.artifact.outputs.digest }}
    description: Registry sha256 digest
  kind:
    value: ${{ steps.metadata.outputs.kind }}
    description: Catalog component kind
  dev-overlay:
    value: ${{ steps.metadata.outputs.dev_overlay }}
    description: DEV desired-state overlay
  prod-overlay:
    value: ${{ steps.metadata.outputs.prod_overlay }}
    description: PROD desired-state overlay
  kustomize-image:
    value: ${{ steps.metadata.outputs.kustomize_image }}
    description: Kustomize image key

runs:
  using: composite
  steps:
    - name: Resolve catalog metadata
      id: metadata
      shell: bash
      env:
        PLATFORMCTL: ${{ inputs.platformctl }}
        COMPONENT: ${{ inputs.component }}
      run: |
        set -Eeuo pipefail
        "${PLATFORMCTL}" component describe --name "${COMPONENT}" >"${RUNNER_TEMP}/component.json"
        for field in kind context dockerfile image_repository dev_overlay prod_overlay kustomize_image; do
          value="$(jq -er --arg field "${field}" '.[$field]' "${RUNNER_TEMP}/component.json")"
          echo "${field}=${value}" >>"${GITHUB_OUTPUT}"
        done
        candidate_repository="$("${PLATFORMCTL}" component candidate-repositories --names "${COMPONENT}" | jq -er '.[0]')"
        echo "candidate_repository=${candidate_repository}" >>"${GITHUB_OUTPUT}"

    - name: Build release binary
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
        KIND: ${{ steps.metadata.outputs.kind }}
      run: |
        set -Eeuo pipefail
        if [[ "${KIND}" == "operator" ]]; then
          (
            cd platform-ownership-guard
            make test
            git diff --exit-code
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -mod=readonly -trimpath -ldflags="-s -w" -o bin/manager ./cmd/main.go
          )
        else
          bash scripts/ci/build-go-service.sh "${COMPONENT}"
        fi

    - name: Build and push immutable candidate
      id: artifact
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
        SOURCE_COMMIT: ${{ inputs.source-commit }}
        REGISTRY: ${{ inputs.registry }}
        CONTEXT: ${{ steps.metadata.outputs.context }}
        DOCKERFILE: ${{ steps.metadata.outputs.dockerfile }}
        CANDIDATE_REPOSITORY: ${{ steps.metadata.outputs.candidate_repository }}
      run: |
        set -Eeuo pipefail
        [[ "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
        image="${REGISTRY}/${CANDIDATE_REPOSITORY}"
        tag="candidate-${SOURCE_COMMIT}"
        manifest="$(docker buildx imagetools inspect "${image}:${tag}" \
          --format '{{json .Manifest}}' 2>/dev/null || true)"
        existing="$(jq -er '.digest // empty' <<<"${manifest}" 2>/dev/null || true)"
        if [[ "${existing}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          digest="${existing}"
        else
          metadata_file="${RUNNER_TEMP}/buildx-${COMPONENT}.json"
          docker buildx build --platform linux/amd64 --push \
            --metadata-file "${metadata_file}" \
            --file "${DOCKERFILE}" --tag "${image}:${tag}" "${CONTEXT}"
          digest="$(jq -er '."containerimage.digest"' "${metadata_file}")"
        fi
        [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
        echo "image=${image}" >>"${GITHUB_OUTPUT}"
        echo "digest=${digest}" >>"${GITHUB_OUTPUT}"
