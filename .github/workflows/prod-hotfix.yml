name: PROD — Emergency Hotfix

on:
  workflow_dispatch:
    inputs:
      service:
        description: Application service or operator receiving the emergency fix
        required: true
        type: string
      source_commit:
        description: Full 40-character hotfix commit
        required: true
      baseline_commit:
        description: Full 40-character released commit from which the hotfix branched
        required: true

permissions:
  id-token: write
  contents: write
  pull-requests: write

concurrency:
  group: prod-desired-state
  cancel-in-progress: false

jobs:
  emergency:
    uses: ./.github/workflows/_reusable-prod-delivery.yml
    with:
      lane: emergency
      service: ${{ inputs.service }}
      source_commit: ${{ inputs.source_commit }}
      baseline_commit: ${{ inputs.baseline_commit }}
    secrets:
      GITOPS_PR_TOKEN: ${{ secrets.GITOPS_PR_TOKEN }}

  emergency-status:
    name: PROD Emergency Status
    needs: [emergency]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout notification action
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Notify failed emergency submission
        if: needs.emergency.result != 'success'
        uses: ./.github/actions/notify-telegram
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_TO }}
          title: PROD emergency hotfix
          status: FAILED
          details: ${{ inputs.service }} at ${{ inputs.source_commit }}

      - name: Enforce emergency result
        env:
          DELIVERY: ${{ needs.emergency.result }}
        run: |
          set -Eeuo pipefail
          [[ "${DELIVERY}" == "success" ]]
