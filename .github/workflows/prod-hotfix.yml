name: PROD — Emergency Hotfix

on:
  workflow_dispatch:
    inputs:
      service:
        description: Application component receiving the emergency fix
        required: true
        type: string
      source_commit:
        description: Full 40-character hotfix commit
        required: true
      baseline_commit:
        description: Full 40-character released commit from which the hotfix branched
        required: true

permissions:
  id-token: write
  contents: write
  pull-requests: write

concurrency:
  group: prod-desired-state
  cancel-in-progress: false

jobs:
  emergency:
    uses: ./.github/workflows/_reusable-prod-delivery.yml
    with:
      lane: emergency
      service: ${{ inputs.service }}
      source_commit: ${{ inputs.source_commit }}
      baseline_commit: ${{ inputs.baseline_commit }}
