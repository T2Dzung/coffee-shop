name: CI — Platform and Security Gate

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-platform-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_DEFAULT_REGION: us-east-1
  AWS_ACCESS_KEY_ID: dummy
  AWS_SECRET_ACCESS_KEY: dummy

jobs:
  # 1. Path Filtering to optimize pipeline execution
  detect-changes:
    name: Detect Infra/Security Changes
    runs-on: ubuntu-latest
    outputs:
      infra-changed: ${{ steps.result.outputs.infra }}
      guard-changed: ${{ steps.result.outputs.guard }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Filter Paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          filters: |
            infra:
              - '.github/actions/**'
              - '.github/workflows/**'
              - 'docker/**'
              - 'infrastructure/**'
              - 'scripts/**'
              - '.yamllint.yml'
              - '.tflint.hcl'
              - '.trivyignore'
              - '.gitleaks.toml'
              - 'go.mod'
              - 'go.sum'
              - 'platform/**'
              - 'policy/**'
              - 'cmd/platformctl/**'
              - 'internal/platformctl/**'
              - 'platform-ownership-guard/**'
            guard:
              - 'platform-ownership-guard/**'

      - name: Normalize Merge Queue Scope
        id: result
        env:
          EVENT_NAME: ${{ github.event_name }}
          INFRA_CHANGED: ${{ steps.filter.outputs.infra }}
          GUARD_CHANGED: ${{ steps.filter.outputs.guard }}
        run: |
          if [[ "${EVENT_NAME}" == "merge_group" ]]; then
            echo "infra=true" >>"${GITHUB_OUTPUT}"
            echo "guard=true" >>"${GITHUB_OUTPUT}"
          else
            echo "infra=${INFRA_CHANGED:-false}" >>"${GITHUB_OUTPUT}"
            echo "guard=${GUARD_CHANGED:-false}" >>"${GITHUB_OUTPUT}"
          fi

  # 2. Infra Correctness Validation (Offline checks)
  infra-correctness:
    name: Infra Validation (Correctness)
    needs: [detect-changes]
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.infra-changed == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.15.7"
          terraform_wrapper: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'infrastructure/ansible/requirements-controller.txt'

      - name: Install Kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: 'v1.35.4'

      - name: Install ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Set up platform validation tools
        uses: ./.github/actions/setup-platformctl
        with:
          validation-tools: "true"

      - name: Install Ansible, Ansible-Lint, and Yamllint
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint yamllint
          if [ -f infrastructure/ansible/requirements-controller.txt ]; then
            pip install -r infrastructure/ansible/requirements-controller.txt
          fi

      - name: Install Ansible Galaxy Collections
        run: |
          if [ -f infrastructure/ansible/requirements.yml ]; then
            ansible-galaxy collection install -r infrastructure/ansible/requirements.yml
          fi

      - name: Verify Tools Installation
        run: |
          terraform version
          ansible --version
          ansible-lint --version
          yamllint --version
          kubeconform -v
          conftest --version
          actionlint --version
          kubectl version --client
          shellcheck --version

      - name: Run Local Validation Script
        run: bash scripts/validate-infra.sh

  # 3. Terraform Linting with AWS Ruleset
  tflint:
    name: Terraform Lint (TFLint)
    needs: [detect-changes]
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.infra-changed == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.15.7"
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
        with:
          tflint_version: v0.51.1

      - name: Initialize TFLint AWS Plugin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tflint --init
        working-directory: .

      - name: Initialize Terraform Modules and Run TFLint
        run: |
          set -Eeuo pipefail
          config="$(pwd)/.tflint.hcl"
          for environment in dev ci prod; do
            root="infrastructure/terraform/envs/${environment}"
            terraform -chdir="${root}" init -backend=false -input=false -no-color
            tflint --config="${config}" --chdir="${root}"
          done

  guard-tests:
    name: Guard Unit & Envtest
    needs: [detect-changes]
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.guard-changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Guard Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: platform-ownership-guard/go.mod
          cache: true
          cache-dependency-path: platform-ownership-guard/go.sum

      - name: Run generated-artifact, unit, and envtest gate
        working-directory: platform-ownership-guard
        run: |
          make test
          git diff --exit-code

  # 4. IaC & Container Config Scan (Trivy Config Scan)
  trivy-config:
    name: Trivy Config Scan
    needs: [detect-changes]
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.infra-changed == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Run Trivy Vulnerability Scanner (IaC / Config Mode)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.72.0'
          scan-type: 'config'
          hide-progress: false
          exit-code: '1'
          severity: 'CRITICAL'
          scan-ref: '.'
          trivyignores: '.trivyignore'

  # 5. Secret Scan with Gitleaks (PR Diff Only)
  secret-scan:
    name: Secret Scan (Gitleaks)
    needs: [detect-changes]
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.infra-changed == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0 # Gitleaks needs history to run on PR diff

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 6. Unified DevSecOps Status Check for Branch Protection
  devsecops-status:
    name: DevSecOps Status
    needs: [detect-changes, infra-correctness, tflint, guard-tests, trivy-config, secret-scan]
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    steps:
      - name: Verify DevSecOps Results
        run: |
          DETECT_RESULT="${{ needs.detect-changes.result }}"
          CHANGED="${{ needs.detect-changes.outputs.infra-changed }}"
          
          # Fail early if detect-changes job failed or was cancelled
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "Error: The pre-requisite job 'detect-changes' failed or was cancelled."
            exit 1
          fi
          
          # If no infra changes were detected, this workflow is skipped and counts as pass
          if [ "$CHANGED" != "true" ]; then
            echo "No infra changes detected. Skipping checks."
            exit 0
          fi

          INFRA="${{ needs.infra-correctness.result }}"
          TFLINT="${{ needs.tflint.result }}"
          TRIVY="${{ needs.trivy-config.result }}"
          SECRETS="${{ needs.secret-scan.result }}"
          GUARD="${{ needs.guard-tests.result }}"

          echo "Infra Validation: $INFRA"
          echo "TFLint: $TFLINT"
          echo "Trivy Config: $TRIVY"
          echo "Secret Scan: $SECRETS"
          echo "Guard tests: $GUARD"

          if [ "$INFRA" = "failure" ] || [ "$INFRA" = "cancelled" ] || \
             [ "$TFLINT" = "failure" ] || [ "$TFLINT" = "cancelled" ] || \
             [ "$TRIVY" = "failure" ] || [ "$TRIVY" = "cancelled" ] || \
             [ "$SECRETS" = "failure" ] || [ "$SECRETS" = "cancelled" ] || \
             [ "$GUARD" = "failure" ] || [ "$GUARD" = "cancelled" ]; then
            echo "One or more required DevSecOps checks failed."
            exit 1
          fi
          echo "All DevSecOps checks passed."
