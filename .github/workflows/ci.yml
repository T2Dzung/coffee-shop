name: CI — Code Quality Gate

on:
  pull_request:
  merge_group:

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

env:
  GOMODCACHE: /home/runner/go/pkg/mod

jobs:
  # 1. Code Quality Check & Static Application Security Testing (SAST)
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Go Environment
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'

      - name: Run GolangCI-Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          args: --timeout=5m

  # 2. Path Filtering for Monorepo Optimization — generates a dynamic build matrix
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-matrix.outputs.services }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Filter Paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          filters: |
            shared:
              - 'go.mod'
              - 'go.sum'
              - 'pkg/**'
              - 'internal/pkg/**'
              - 'db/**'
              - 'proto/**'
              - 'tools/**'
              - 'third_party/**'
              - 'sqlc.yaml'
              - 'buf.gen.yaml'
              - 'buf.work.yaml'
              - 'Makefile'
              - '.golangci.yml'
              - '.github/workflows/**'
              - 'scripts/ci/**'
            counter:
              - 'cmd/counter/**'
              - 'internal/counter/**'
              - 'docker/Dockerfile-counter'
            barista:
              - 'cmd/barista/**'
              - 'internal/barista/**'
              - 'docker/Dockerfile-barista'
            kitchen:
              - 'cmd/kitchen/**'
              - 'internal/kitchen/**'
              - 'docker/Dockerfile-kitchen'
            product:
              - 'cmd/product/**'
              - 'internal/product/**'
              - 'docker/Dockerfile-product'
            proxy:
              - 'cmd/proxy/**'
              - 'internal/proxy/**'
              - 'docker/Dockerfile-proxy'
            web:
              - 'cmd/web/**'
              - 'internal/web/**'
              - 'docker/Dockerfile-web'

      - name: Generate Dynamic Matrix
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          SHARED_CHANGED: ${{ steps.filter.outputs.shared }}
          RAW_CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          if [[ "${EVENT_NAME}" == "merge_group" || "${SHARED_CHANGED}" == "true" ]]; then
            SERVICES_JSON='["counter","barista","kitchen","product","proxy","web"]'
          else
            if [ -z "$RAW_CHANGES" ] || [ "$RAW_CHANGES" = "null" ] || [ "$RAW_CHANGES" = "[]" ]; then
              SERVICES_JSON='[]'
            else
              SERVICES_JSON=$(printf '%s' "$RAW_CHANGES" | jq -c 'map(select(. != "shared"))')
            fi
          fi

          echo "services=$SERVICES_JSON" >> "$GITHUB_OUTPUT"

  # 3. Build & Scan (validation only — no push to registry)
  build-and-scan:
    name: Build & Scan
    needs: [detect-changes]
    runs-on: ubuntu-latest
    if: |
      needs.detect-changes.outputs.services != '[]' &&
      needs.detect-changes.outputs.services != ''
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Go Environment
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'

      - name: Build Go Binary
        run: bash scripts/ci/build-go-service.sh "${{ matrix.service }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build Docker Image (Local Only)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./docker/Dockerfile-${{ matrix.service }}
          push: false
          tags: go-coffeeshop-${{ matrix.service }}:${{ github.sha }}
          load: true

      - name: Trivy Container Image Scan (DevSecOps Gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.72.0'
          image-ref: go-coffeeshop-${{ matrix.service }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

  # 4. Unified Status Check for Branch Protection
  ci-status:
    name: CI Status
    needs: [lint, build-and-scan]
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    steps:
      - name: Verify CI Results
        run: |
          LINT="${{ needs.lint.result }}"
          BUILD="${{ needs.build-and-scan.result }}"
          echo "Lint result: $LINT | Build-Scan result: $BUILD"

          if [ "$LINT" = "failure" ] || [ "$LINT" = "cancelled" ] || [ "$BUILD" = "failure" ] || [ "$BUILD" = "cancelled" ]; then
            echo "CI pipeline failed."
            exit 1
          fi
          echo "CI pipeline passed."
