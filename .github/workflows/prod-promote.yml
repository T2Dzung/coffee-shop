name: PROD — Promote QA-Approved Digest

on:
  workflow_dispatch:
    inputs:
      service:
        description: QA-approved component name from platform/components.yaml
        required: true
        type: string
      source_commit:
        description: Full 40-character commit of the QA-approved candidate
        required: true

permissions:
  id-token: write
  contents: write
  pull-requests: write

concurrency:
  group: prod-desired-state
  cancel-in-progress: false

jobs:
  standard:
    uses: ./.github/workflows/_reusable-prod-delivery.yml
    with:
      lane: standard
      service: ${{ inputs.service }}
      source_commit: ${{ inputs.source_commit }}
