name: PROD — Promote Reviewed Digest

on:
  push:
    paths:
      - infrastructure/release-candidates/*/qa/*.json
  workflow_dispatch:
    inputs:
      promotion_lane:
        description: Standard QA-approved release or manually reviewed stateful maintenance
        required: true
        default: standard
        type: choice
        options:
          - standard
          - maintenance
      components:
        description: Comma-separated reviewed component names from one release set
        required: true
        type: string
      source_commit:
        description: Full 40-character commit of the reviewed candidate
        required: true

permissions:
  id-token: write
  contents: write
  pull-requests: write

concurrency:
  group: prod-desired-state-${{ inputs.source_commit || github.sha }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve Reviewed Release Set
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      components: ${{ steps.resolve.outputs.components }}
      source_commit: ${{ steps.resolve.outputs.source_commit }}
      lane: ${{ steps.resolve.outputs.lane }}
      destination_tag_prefix: ${{ steps.resolve.outputs.destination_tag_prefix }}
    steps:
      - name: Checkout protected desired state
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up platformctl
        uses: ./.github/actions/setup-platformctl

      - name: Resolve component matrix
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          INPUT_LANE: ${{ inputs.promotion_lane }}
          INPUT_COMPONENTS: ${{ inputs.components }}
          INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -Eeuo pipefail
          if [[ "${EVENT_NAME}" == "push" ]]; then
            LANE="standard"
            [[ "${BEFORE_SHA}" =~ ^[0-9a-f]{40}$ && "${AFTER_SHA}" =~ ^[0-9a-f]{40}$ ]]
            mapfile -t qa_files < <(
              git diff --diff-filter=AM --name-only "${BEFORE_SHA}" "${AFTER_SHA}" -- \
                'infrastructure/release-candidates/*/qa/*.json'
            )
            ((${#qa_files[@]} > 0))
            components_json="$(
              printf '%s\n' "${qa_files[@]}" |
                jq -Rsc 'split("\n") | map(select(length > 0) | split("/")[2]) | unique'
            )"
            source_commits="$(
              printf '%s\n' "${qa_files[@]}" |
                jq -Rsc 'split("\n") | map(select(length > 0) | split("/")[4] | rtrimstr(".json")) | unique'
            )"
            [[ "$(jq 'length' <<<"${source_commits}")" -eq 1 ]]
            SOURCE_COMMIT="$(jq -er '.[0]' <<<"${source_commits}")"
            COMPONENTS="$(jq -er 'join(",")' <<<"${components_json}")"
          else
            LANE="${INPUT_LANE}"
            SOURCE_COMMIT="${INPUT_SOURCE_COMMIT}"
            COMPONENTS="${INPUT_COMPONENTS}"
          fi
          [[ "${LANE}" == "standard" || "${LANE}" == "maintenance" ]]
          [[ "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "${SOURCE_COMMIT}" HEAD
          allow_migration=false
          if [[ "${LANE}" == "maintenance" ]]; then
            allow_migration=true
          fi
          components="$(
            "${RUNNER_TEMP}/platformctl" component resolve \
              --names "${COMPONENTS}" \
              --allow-migration="${allow_migration}" |
              jq -c .
          )"
          jq -e 'length > 0' <<<"${components}" >/dev/null
          if [[ "${LANE}" == "maintenance" ]]; then
            jq -e 'length == 1' <<<"${components}" >/dev/null
            destination_tag_prefix="maintenance"
          else
            destination_tag_prefix="release"
          fi
          {
            echo "components=${components}"
            echo "source_commit=${SOURCE_COMMIT}"
            echo "lane=${LANE}"
            echo "destination_tag_prefix=${destination_tag_prefix}"
          } >>"${GITHUB_OUTPUT}"

  copy-reviewed:
    name: Copy ${{ matrix.component }} to PROD
    needs: [resolve]
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.resolve.outputs.components) }}
    steps:
      - name: Checkout protected desired state
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up typed release policy
        id: platformctl
        uses: ./.github/actions/setup-platformctl

      - name: Resolve reviewed candidate
        id: artifact
        env:
          COMPONENT: ${{ matrix.component }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
          LANE: ${{ needs.resolve.outputs.lane }}
        run: |
          set -Eeuo pipefail
          "${RUNNER_TEMP}/platformctl" component describe --name "${COMPONENT}" \
            >"${RUNNER_TEMP}/component.json"
          candidate="infrastructure/release-candidates/${COMPONENT}/${SOURCE_COMMIT}.json"
          if [[ "${LANE}" == "maintenance" ]]; then
            "${RUNNER_TEMP}/platformctl" release maintenance \
              --service "${COMPONENT}" --source-commit "${SOURCE_COMMIT}" \
              --candidate "${candidate}" >"${RUNNER_TEMP}/artifact.json"
          else
            "${RUNNER_TEMP}/platformctl" release standard \
              --service "${COMPONENT}" --source-commit "${SOURCE_COMMIT}" \
              --candidate "${candidate}" \
              --qa "infrastructure/release-candidates/${COMPONENT}/qa/${SOURCE_COMMIT}.json" \
              >"${RUNNER_TEMP}/artifact.json"
          fi
          {
            echo "source_image=$(jq -er .image "${RUNNER_TEMP}/artifact.json")"
            echo "source_digest=$(jq -er .digest "${RUNNER_TEMP}/artifact.json")"
            echo "source_region=$(jq -er .region "${RUNNER_TEMP}/artifact.json")"
            echo "repository=$(jq -er .image_repository "${RUNNER_TEMP}/component.json")"
          } >>"${GITHUB_OUTPUT}"

      - name: Require one PROD region
        env:
          SOURCE_REGION: ${{ steps.artifact.outputs.source_region }}
          PROD_REGION: ${{ vars.PROD_AWS_REGION }}
        run: |
          set -Eeuo pipefail
          [[ "${SOURCE_REGION}" == "${PROD_REGION}" ]] || {
            echo "Candidate region ${SOURCE_REGION} differs from PROD region ${PROD_REGION}." >&2
            exit 1
          }

      - name: Configure PROD promotion identity
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.PROD_AWS_ROLE_ARN }}
          aws-region: ${{ vars.PROD_AWS_REGION }}
          mask-aws-account-id: true

      - name: Log in to PROD account ECR
        id: prod-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Install Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Verify candidate workflow identity
        env:
          ARTIFACT: ${{ steps.artifact.outputs.source_image }}@${{ steps.artifact.outputs.source_digest }}
        run: |
          set -Eeuo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/"
          identity+="release-candidate.yml@refs/heads/${{ github.event.repository.default_branch }}"
          cosign verify --certificate-identity "${identity}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${ARTIFACT}"

      - name: Re-scan exact reviewed candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: ${{ steps.artifact.outputs.source_image }}@${{ steps.artifact.outputs.source_digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          cache: "true"

      - name: Copy exact reviewed candidate without rebuild
        id: prod-copy
        uses: ./.github/actions/copy-immutable-artifact
        with:
          source-image: ${{ steps.artifact.outputs.source_image }}
          source-digest: ${{ steps.artifact.outputs.source_digest }}
          destination-image: ${{ steps.prod-ecr.outputs.registry }}/${{ steps.artifact.outputs.repository }}
          destination-tag: ${{ needs.resolve.outputs.destination_tag_prefix }}-${{ needs.resolve.outputs.source_commit }}

      - name: Sign and verify PROD repository identity
        env:
          ARTIFACT: ${{ steps.prod-copy.outputs.image }}@${{ steps.prod-copy.outputs.digest }}
          SOURCE_DIGEST: ${{ steps.artifact.outputs.source_digest }}
          PROD_DIGEST: ${{ steps.prod-copy.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ "${PROD_DIGEST}" == "${SOURCE_DIGEST}" ]]
          identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          if ! cosign verify --certificate-identity "${identity}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${ARTIFACT}" >/dev/null 2>&1; then
            cosign sign --yes "${ARTIFACT}"
          fi
          cosign verify --certificate-identity "${identity}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${ARTIFACT}"

      - name: Record immutable PROD artifact
        env:
          COMPONENT: ${{ matrix.component }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
          LANE: ${{ needs.resolve.outputs.lane }}
          PROD_IMAGE: ${{ steps.prod-copy.outputs.image }}
          PROD_DIGEST: ${{ steps.prod-copy.outputs.digest }}
        run: |
          set -Eeuo pipefail
          mkdir -p "${RUNNER_TEMP}/prod-artifact"
          jq -n \
            --arg service "${COMPONENT}" \
            --arg source_commit "${SOURCE_COMMIT}" \
            --arg lane "${LANE}" \
            --arg prod_image "${PROD_IMAGE}" \
            --arg prod_digest "${PROD_DIGEST}" \
            --arg workflow_run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{schema_version: 1, lane: $lane, service: $service,
              source_commit: $source_commit, prod_image: $prod_image,
              prod_digest: $prod_digest, workflow_run: $workflow_run}' \
            >"${RUNNER_TEMP}/prod-artifact/${COMPONENT}.json"

      - name: Upload immutable PROD artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prod-${{ needs.resolve.outputs.lane }}-${{ matrix.component }}
          path: ${{ runner.temp }}/prod-artifact/${{ matrix.component }}.json
          retention-days: 3

  submit-reviewed:
    name: Submit Reviewed PROD Release Set
    needs: [resolve, copy-reviewed]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout protected desired state
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITOPS_PR_TOKEN }}

      - name: Set up typed release policy
        uses: ./.github/actions/setup-platformctl

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2

      - name: Download immutable PROD artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: prod-${{ needs.resolve.outputs.lane }}-*
          path: ${{ runner.temp }}/prod-reviewed
          merge-multiple: true

      - name: Stage one reviewed PROD release set
        env:
          COMPONENTS: ${{ needs.resolve.outputs.components }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
          LANE: ${{ needs.resolve.outputs.lane }}
        run: |
          set -Eeuo pipefail
          : >"${RUNNER_TEMP}/prod-overlays"
          while IFS= read -r component; do
            metadata="${RUNNER_TEMP}/prod-reviewed/${component}.json"
            [[ -f "${metadata}" ]]
            jq -e \
              --arg service "${component}" \
              --arg source_commit "${SOURCE_COMMIT}" \
              --arg lane "${LANE}" \
              '.schema_version == 1 and .lane == $lane and
               .service == $service and .source_commit == $source_commit and
               (.prod_image | length > 0) and
               (.prod_digest | test("^sha256:[0-9a-f]{64}$")) and
               (.workflow_run | length > 0)' "${metadata}" >/dev/null

            "${RUNNER_TEMP}/platformctl" component describe --name "${component}" \
              >"${RUNNER_TEMP}/component.json"
            overlay="$(jq -er .prod_overlay "${RUNNER_TEMP}/component.json")"
            kustomize_image="$(jq -er .kustomize_image "${RUNNER_TEMP}/component.json")"
            image="$(jq -er .prod_image "${metadata}")"
            digest="$(jq -er .prod_digest "${metadata}")"
            workflow_run="$(jq -er .workflow_run "${metadata}")"

            (
              cd "${overlay}"
              kustomize edit set image "${kustomize_image}=${image}@${digest}"
            )
            printf '%s\n' "${overlay}" >>"${RUNNER_TEMP}/prod-overlays"

            release_file="infrastructure/releases/prod/lanes/${LANE}/${component}/${SOURCE_COMMIT}.json"
            mkdir -p "$(dirname "${release_file}")"
            "${RUNNER_TEMP}/platformctl" release manifest \
              --lane "${LANE}" --service "${component}" --source-commit "${SOURCE_COMMIT}" \
              --image "${image}" --digest "${digest}" --workflow-run "${workflow_run}" \
              >"${release_file}"
          done < <(jq -r '.[]' <<<"${COMPONENTS}")

          sort -u "${RUNNER_TEMP}/prod-overlays" -o "${RUNNER_TEMP}/prod-overlays"
          while IFS= read -r overlay; do
            kustomize build "${overlay}" >/dev/null
            git add "${overlay}/kustomization.yaml"
          done <"${RUNNER_TEMP}/prod-overlays"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "infrastructure/releases/prod/lanes/${LANE}"
          git commit -m "chore(prod): ${LANE} release set ${SOURCE_COMMIT::12}"

      - name: Open one protected PROD desired-state PR
        uses: ./.github/actions/submit-gitops-pr
        with:
          token: ${{ secrets.GITOPS_PR_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: automation/prod-${{ needs.resolve.outputs.lane }}-set-${{ github.run_id }}-${{ github.run_attempt }}
          title: "chore(prod): ${{ needs.resolve.outputs.lane }} immutable release set"
          body: >-
            Promotes every reviewed ${{ needs.resolve.outputs.lane }} component from protected
            commit ${{ needs.resolve.outputs.source_commit }} without rebuilding.
          auto-merge: "true"

  promotion-status:
    name: PROD Promotion Status
    needs: [resolve, copy-reviewed, submit-reviewed]
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout notification action
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Notify failed PROD promotion submission
        if: needs.submit-reviewed.result != 'success'
        uses: ./.github/actions/notify-telegram
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_TO }}
          title: PROD reviewed promotion
          status: FAILED
          details: Source commit ${{ needs.resolve.outputs.source_commit }}

      - name: Enforce PROD promotion result
        env:
          RESOLVE: ${{ needs.resolve.result }}
          COPY: ${{ needs.copy-reviewed.result }}
          SUBMIT: ${{ needs.submit-reviewed.result }}
        run: |
          set -Eeuo pipefail
          [[ "${RESOLVE}" == "success" ]]
          [[ "${COPY}" == "success" ]]
          [[ "${SUBMIT}" == "success" ]]
