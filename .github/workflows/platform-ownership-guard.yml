name: PlatformOwnershipGuard - Supply Chain and GitOps

on:
  push:
    paths:
      - 'platform-ownership-guard/**'
      - '!platform-ownership-guard/config/dev/kustomization.yaml'
      - '.github/workflows/platform-ownership-guard.yml'
      - 'infrastructure/terraform/envs/dev/ecr.tf'
      - 'infrastructure/terraform/envs/dev/github_oidc.tf'
      - 'infrastructure/k8s/environments/dev/gitops/applications/platform-ownership-guard.yaml'
      - 'scripts/validate-infra.sh'
      - 'scripts/validation/validate-ci-contracts.sh'
      - 'scripts/verify-dev-runtime.sh'
  pull_request:
    paths:
      - 'platform-ownership-guard/**'
      - '.github/workflows/platform-ownership-guard.yml'
      - 'infrastructure/terraform/envs/dev/ecr.tf'
      - 'infrastructure/terraform/envs/dev/github_oidc.tf'
      - 'infrastructure/k8s/environments/dev/gitops/applications/platform-ownership-guard.yaml'
      - 'scripts/validate-infra.sh'
      - 'scripts/validation/validate-ci-contracts.sh'
      - 'scripts/verify-dev-runtime.sh'

concurrency:
  group: guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: platform-ownership-guard

jobs:
  test:
    name: Unit, Envtest and Static Check
    if: >-
      github.event_name == 'pull_request' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: platform-ownership-guard/go.mod
          cache: true
          cache-dependency-path: platform-ownership-guard/go.sum

      - name: Run module tests, vet and envtest
        working-directory: platform-ownership-guard
        run: |
          make test
          git diff --exit-code

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2

      - name: Render DEV bundle
        run: kustomize build platform-ownership-guard/config/dev >/tmp/platform-ownership-guard.yaml

  build-and-supply-chain:
    name: Push, Scan, SBOM, Sign and Pin Digest
    if: >-
      github.event_name == 'push' &&
      github.ref_name == github.event.repository.default_branch
    needs: [test]
    runs-on: coffeeshop-runner-v3
    environment: dev
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITOPS_PR_TOKEN }}

      - name: Set up Go for release build
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: platform-ownership-guard/go.mod
          cache: false

      - name: Build release binary with local persistent cache
        working-directory: platform-ownership-guard
        env:
          GOMODCACHE: /go-cache/mod/platform-ownership-guard/${{ github.ref_name }}
          GOCACHE: /go-cache/build/platform-ownership-guard/${{ github.ref_name }}
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p bin "${GOMODCACHE}" "${GOCACHE}"
          go build -mod=readonly -trimpath -ldflags="-s -w" -o bin/manager ./cmd/main.go
          test -x bin/manager

      - name: Validate AWS role secret
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [[ -z "${AWS_ROLE_ARN}" ]]; then
            echo "::error title=Missing GitHub secret::Set AWS_ROLE_ARN for the DEV GitHub Actions role"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@5579c002bb4778aa43395ef1df492868a9a1c83f # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@4625ce35226a7557230889aae2f52eb50ec3dcda # v2.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00baa16ece964efeb # v3.3.0

      - name: Build and push one immutable artifact
        id: build-image
        uses: docker/build-push-action@c382f710d39a5bb4e430307530a720f50c2d3318 # v6.0.0
        with:
          context: platform-ownership-guard
          file: platform-ownership-guard/Dockerfile.release
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Validate registry digest
        id: artifact
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          if [[ ! "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error title=Invalid registry digest::${DIGEST}"
            exit 1
          fi
          echo "image=${REGISTRY}/${ECR_REPOSITORY}@${DIGEST}" >>"${GITHUB_OUTPUT}"

      - name: Scan exact ECR digest
        uses: aquasecurity/trivy-action@b2933f565dbc598b29947660e66259e3c7bc8561 # v0.20.0
        with:
          image-ref: ${{ steps.artifact.outputs.image }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          cache: 'false'

      - name: Generate SBOM from exact ECR digest
        uses: anchore/sbom-action@e8d2a6937ecead383dfe75190d104edd1f9c5751 # v0.16.0
        with:
          image: ${{ steps.artifact.outputs.image }}
          format: spdx-json
          output-file: platform-ownership-guard-sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: platform-ownership-guard-sbom-${{ github.sha }}
          path: platform-ownership-guard-sbom.spdx.json
          retention-days: 14

      - name: Install Cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0

      - name: Keyless sign and verify exact digest
        env:
          IMAGE: ${{ steps.artifact.outputs.image }}
          EXPECTED_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/platform-ownership-guard.yml@${{ github.ref }}
        run: |
          if ! cosign verify \
            --certificate-identity "${EXPECTED_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}" >/dev/null 2>&1; then
            cosign sign --yes "${IMAGE}"
          fi
          cosign verify \
            --certificate-identity "${EXPECTED_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2

      - name: Pin exact digest in GitOps source
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          DIGEST: ${{ steps.build-image.outputs.digest }}
          GITHUB_TOKEN: ${{ secrets.GITOPS_PR_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cd platform-ownership-guard/config/dev
          kustomize edit set image "controller=${REGISTRY}/${ECR_REPOSITORY}@${DIGEST}"
          cd ../../..

          kustomize build platform-ownership-guard/config/dev >/tmp/platform-ownership-guard.yaml
          if ! grep -Fq "image: ${REGISTRY}/${ECR_REPOSITORY}@${DIGEST}" /tmp/platform-ownership-guard.yaml; then
            echo "::error title=Digest pin validation failed::Rendered Deployment does not use the verified digest"
            exit 1
          fi

          git add platform-ownership-guard/config/dev/kustomization.yaml
          if git diff --cached --quiet; then
            echo "GitOps already pins the verified digest; no commit required."
          else
            git commit -m "chore(gitops): pin PlatformOwnershipGuard digest ${DIGEST}"
            bash scripts/ci/create-gitops-pr.sh \
              "${DEFAULT_BRANCH}" \
              "automation/guard-digest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              "chore(gitops): promote PlatformOwnershipGuard digest" \
              "Automated DEV desired-state update for the image that passed test, scan, SBOM generation and signature verification in workflow run ${GITHUB_RUN_ID}."
          fi

      - name: Supply-chain summary
        env:
          IMAGE: ${{ steps.artifact.outputs.image }}
        run: |
          {
            echo "### PlatformOwnershipGuard supply-chain gates"
            echo "- Unit/envtest/static: passed"
            echo "- Exact artifact: \`${IMAGE}\`"
            echo "- Trivy CRITICAL policy: passed"
            echo "- SPDX-JSON SBOM: uploaded"
            echo "- Cosign keyless signature and identity verification: passed"
            echo "- GitOps digest pin: submitted to the protected default branch through a pull request"
          } >>"${GITHUB_STEP_SUMMARY}"
