name: Release Candidate — Build Once & Submit DEV Desired State

on:
  push:
  workflow_dispatch:

concurrency:
  group: release-candidate-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Default-Branch Changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-matrix.outputs.services }}
    steps:
      - name: Checkout protected source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.sha }}

      - name: Filter service paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          filters: |
            shared:
              - 'go.mod'
              - 'go.sum'
              - 'pkg/**'
              - 'internal/pkg/**'
              - 'db/**'
              - 'proto/**'
              - 'tools/**'
              - 'third_party/**'
              - 'sqlc.yaml'
              - 'buf.gen.yaml'
              - 'buf.work.yaml'
              - 'Makefile'
              - '.golangci.yml'
              - '.github/workflows/deploy-dev.yml'
              - 'scripts/ci/**'
            counter:
              - 'cmd/counter/**'
              - 'internal/counter/**'
              - 'docker/Dockerfile-counter'
            barista:
              - 'cmd/barista/**'
              - 'internal/barista/**'
              - 'docker/Dockerfile-barista'
            kitchen:
              - 'cmd/kitchen/**'
              - 'internal/kitchen/**'
              - 'docker/Dockerfile-kitchen'
            product:
              - 'cmd/product/**'
              - 'internal/product/**'
              - 'docker/Dockerfile-product'
            proxy:
              - 'cmd/proxy/**'
              - 'internal/proxy/**'
              - 'docker/Dockerfile-proxy'
            web:
              - 'cmd/web/**'
              - 'internal/web/**'
              - 'docker/Dockerfile-web'

      - name: Generate build matrix
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          SHARED_CHANGED: ${{ steps.filter.outputs.shared }}
          RAW_CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" || "${SHARED_CHANGED}" == "true" ]]; then
            SERVICES_JSON='["counter","barista","kitchen","product","proxy","web"]'
          elif [[ -z "${RAW_CHANGES}" || "${RAW_CHANGES}" == "null" || "${RAW_CHANGES}" == "[]" ]]; then
            SERVICES_JSON='[]'
          else
            SERVICES_JSON="$(jq -c 'map(select(. != "shared"))' <<<"${RAW_CHANGES}")"
          fi
          echo "services=${SERVICES_JSON}" >>"${GITHUB_OUTPUT}"

  build-release-artifact:
    name: Build Immutable ${{ matrix.service }}
    needs: [detect-changes]
    if: >-
      needs.detect-changes.outputs.services != '[]' &&
      needs.detect-changes.outputs.services != ''
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.sha }}

      - name: Resolve release commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >>"${GITHUB_OUTPUT}"

      - name: Configure DEV artifact credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.DEV_AWS_REGION || 'ap-southeast-1' }}
          mask-aws-account-id: true

      - name: Log in to DEV ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Reuse existing immutable artifact
        id: artifact
        env:
          SERVICE: ${{ matrix.service }}
          REVISION: ${{ steps.source.outputs.sha }}
        run: |
          DIGEST="$(aws ecr describe-images \
            --repository-name "go-coffeeshop-${SERVICE}" \
            --image-ids "imageTag=candidate-${REVISION}" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || true)"
          if [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Immutable artifact already exists: ${DIGEST}"
            echo "exists=true" >>"${GITHUB_OUTPUT}"
            echo "digest=${DIGEST}" >>"${GITHUB_OUTPUT}"
          else
            echo "exists=false" >>"${GITHUB_OUTPUT}"
          fi

      - name: Set up Go
        if: steps.artifact.outputs.exists != 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Build Go binary
        if: steps.artifact.outputs.exists != 'true'
        run: bash scripts/ci/build-go-service.sh "${{ matrix.service }}"

      - name: Set up Docker Buildx
        if: steps.artifact.outputs.exists != 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build release image once
        if: steps.artifact.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./docker/Dockerfile-${{ matrix.service }}
          push: false
          tags: go-coffeeshop-${{ matrix.service }}:${{ steps.source.outputs.sha }}
          load: true

      - name: Scan exact local release image
        if: steps.artifact.outputs.exists != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: go-coffeeshop-${{ matrix.service }}:${{ steps.source.outputs.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          cache: 'false'

      - name: Push immutable candidate once
        if: steps.artifact.outputs.exists != 'true'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SERVICE: ${{ matrix.service }}
          REVISION: ${{ steps.source.outputs.sha }}
        run: |
          LOCAL_IMAGE="go-coffeeshop-${SERVICE}:${REVISION}"
          REMOTE_IMAGE="${REGISTRY}/go-coffeeshop-${SERVICE}:candidate-${REVISION}"
          docker tag "${LOCAL_IMAGE}" "${REMOTE_IMAGE}"
          docker push "${REMOTE_IMAGE}"

  submit-dev-candidate:
    name: Submit DEV Candidate PR
    needs: [detect-changes, build-release-artifact]
    if: >-
      needs.build-release-artifact.result == 'success' &&
      needs.detect-changes.outputs.services != '[]' &&
      needs.detect-changes.outputs.services != ''
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout default-branch desired state
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITOPS_PR_TOKEN }}

      - name: Resolve release commit
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            SHA="$(git rev-parse HEAD)"
          else
            SHA="${EVENT_SHA}"
          fi
          echo "sha=${SHA}" >>"${GITHUB_OUTPUT}"

      - name: Configure DEV artifact credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.DEV_AWS_REGION || 'ap-southeast-1' }}
          mask-aws-account-id: true

      - name: Log in to DEV ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2

      - name: Pin exact DEV digests and record service candidates
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REVISION: ${{ steps.source.outputs.sha }}
          SERVICES_JSON: ${{ needs.detect-changes.outputs.services }}
        run: |
          cd infrastructure/k8s/apps/coffeeshop/overlays/dev
          while IFS= read -r SERVICE; do
            DIGEST="$(aws ecr describe-images \
              --repository-name "go-coffeeshop-${SERVICE}" \
              --image-ids "imageTag=candidate-${REVISION}" \
              --query 'imageDetails[0].imageDigest' \
              --output text)"
            if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid ${SERVICE} digest: ${DIGEST}" >&2
              exit 1
            fi
            kustomize edit set image \
              "go-coffeeshop-${SERVICE}=${REGISTRY}/go-coffeeshop-${SERVICE}@${DIGEST}"

            CANDIDATE_DIR="../../../../../release-candidates/${SERVICE}"
            mkdir -p "${CANDIDATE_DIR}"
            jq -n \
              --arg service "${SERVICE}" \
              --arg source_commit "${REVISION}" \
              --arg source_image "${REGISTRY}/go-coffeeshop-${SERVICE}" \
              --arg source_digest "${DIGEST}" \
              --arg workflow_run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{
                schema_version: 1,
                status: "built",
                service: $service,
                source_commit: $source_commit,
                source_image: $source_image,
                source_digest: $source_digest,
                workflow_run: $workflow_run,
                created_at: $created_at
              }' >"${CANDIDATE_DIR}/${REVISION}.json"
          done < <(jq -r '.[]' <<<"${SERVICES_JSON}")

      - name: Open desired-state pull request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ secrets.GITOPS_PR_TOKEN }}
          REVISION: ${{ steps.source.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infrastructure/k8s/apps/coffeeshop/overlays/dev/kustomization.yaml
          if [[ -d infrastructure/release-candidates ]]; then
            git add infrastructure/release-candidates
          fi

          if git diff --cached --quiet; then
            echo "Desired state already references this immutable release candidate."
            exit 0
          fi

          git commit -m "chore(gitops): submit DEV candidate ${REVISION}"
          bash scripts/ci/create-gitops-pr.sh \
            "${DEFAULT_BRANCH}" \
            "automation/dev-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "chore(gitops): submit DEV candidate ${REVISION::12}" \
            "Immutable release candidate built from protected source ${REVISION}. Merge this PR before formal QA approval."

  release-status:
    name: Release Candidate Status
    needs: [detect-changes, build-release-artifact, submit-dev-candidate]
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Enforce release result
        env:
          DETECT: ${{ needs.detect-changes.result }}
          BUILD: ${{ needs.build-release-artifact.result }}
          SUBMIT: ${{ needs.submit-dev-candidate.result }}
        run: |
          echo "detect=${DETECT} build=${BUILD} submit=${SUBMIT}"
          if [[ "${DETECT}" != "success" ]]; then
            exit 1
          fi
          if [[ "${BUILD}" == "skipped" && "${SUBMIT}" == "skipped" ]]; then
            exit 0
          fi
          [[ "${BUILD}" == "success" && "${SUBMIT}" == "success" ]]
