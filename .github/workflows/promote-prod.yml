name: PROD — Promote QA-Approved Service Digest

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service artifact to promote
        required: true
        type: choice
        options:
          - barista
          - counter
          - kitchen
          - migrate
          - product
          - proxy
          - web
      source_commit:
        description: Full 40-character commit of the QA-approved service candidate
        required: true

permissions:
  id-token: write
  contents: write
  pull-requests: write

concurrency:
  group: prod-desired-state
  cancel-in-progress: false

jobs:
  promote-prod:
    name: Verify, Copy Exact Digest & Submit PROD PR
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout protected default branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITOPS_PR_TOKEN }}

      - name: Require matching approved QA evidence
        id: candidate
        env:
          SERVICE: ${{ inputs.service }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          if [[ ! "${SERVICE}" =~ ^(barista|counter|kitchen|migrate|product|proxy|web)$ ]]; then
            echo "Unsupported service: ${SERVICE}" >&2
            exit 1
          fi
          if [[ ! "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_commit must be a full lowercase Git SHA." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${SOURCE_COMMIT}" HEAD; then
            echo "Candidate source commit is not contained in the protected default branch." >&2
            exit 1
          fi

          CANDIDATE_FILE="infrastructure/release-candidates/${SERVICE}/${SOURCE_COMMIT}.json"
          QA_FILE="infrastructure/release-candidates/${SERVICE}/qa/${SOURCE_COMMIT}.json"
          [[ -f "${CANDIDATE_FILE}" ]] || {
            echo "Missing candidate metadata: ${CANDIDATE_FILE}" >&2
            exit 1
          }
          [[ -f "${QA_FILE}" ]] || {
            echo "Missing QA evidence: ${QA_FILE}" >&2
            exit 1
          }

          jq -e \
            --arg commit "${SOURCE_COMMIT}" \
            --arg service "${SERVICE}" \
            '.schema_version == 1
             and .status == "built"
             and .service == $service
             and .source_commit == $commit
             and (.source_digest | test("^sha256:[0-9a-f]{64}$"))' \
            "${CANDIDATE_FILE}" >/dev/null
          jq -e \
            --arg commit "${SOURCE_COMMIT}" \
            --arg service "${SERVICE}" \
            --arg image "$(jq -r '.source_image' "${CANDIDATE_FILE}")" \
            --arg digest "$(jq -r '.source_digest' "${CANDIDATE_FILE}")" \
            '.schema_version == 1
             and .qa_status == "approved"
             and .service == $service
             and .source_commit == $commit
             and .source_image == $image
             and .source_digest == $digest
             and (.evidence_url | length > 0)' \
            "${QA_FILE}" >/dev/null

          echo "image=$(jq -r '.source_image' "${CANDIDATE_FILE}")" >>"${GITHUB_OUTPUT}"
          echo "digest=$(jq -r '.source_digest' "${CANDIDATE_FILE}")" >>"${GITHUB_OUTPUT}"

      - name: Configure read-only DEV candidate credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.DEV_ARTIFACT_READ_ROLE_ARN }}
          aws-region: ${{ vars.DEV_AWS_REGION || 'ap-southeast-1' }}
          mask-aws-account-id: true

      - name: Log in to DEV candidate ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Re-scan exact QA-approved digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: ${{ steps.candidate.outputs.image }}@${{ steps.candidate.outputs.digest }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          cache: 'false'

      - name: Install pinned registry copy tool
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.4'
          cache: false

      - name: Build pinned crane utility
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@c68d899782693b63b7549166812aa996f17a660c
          crane version

      - name: Configure PROD destination credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.PROD_AWS_ROLE_ARN }}
          aws-region: ${{ vars.PROD_AWS_REGION || 'ap-southeast-1' }}
          mask-aws-account-id: true

      - name: Log in to PROD ECR
        id: login-prod-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Copy exact OCI artifact without rebuilding
        id: promoted
        env:
          SERVICE: ${{ inputs.service }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_IMAGE: ${{ steps.candidate.outputs.image }}
          SOURCE_DIGEST: ${{ steps.candidate.outputs.digest }}
          PROD_REGISTRY: ${{ steps.login-prod-ecr.outputs.registry }}
        run: |
          SOURCE_REF="${SOURCE_IMAGE}@${SOURCE_DIGEST}"
          DESTINATION_IMAGE="${PROD_REGISTRY}/go-coffeeshop-${SERVICE}"
          DESTINATION_REF="${DESTINATION_IMAGE}:release-${SOURCE_COMMIT}"

          EXISTING_DIGEST="$(aws ecr describe-images \
            --repository-name "go-coffeeshop-${SERVICE}" \
            --image-ids "imageTag=release-${SOURCE_COMMIT}" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || true)"
          if [[ "${EXISTING_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            if [[ "${EXISTING_DIGEST}" != "${SOURCE_DIGEST}" ]]; then
              echo "Immutable PROD tag already points to a different digest." >&2
              exit 1
            fi
            echo "PROD already contains the exact immutable artifact; copy is idempotently skipped."
          else
            crane copy "${SOURCE_REF}" "${DESTINATION_REF}"
          fi

          DESTINATION_DIGEST="$(crane digest "${DESTINATION_REF}")"
          if [[ "${DESTINATION_DIGEST}" != "${SOURCE_DIGEST}" ]]; then
            echo "Registry copy changed digest: source=${SOURCE_DIGEST} destination=${DESTINATION_DIGEST}" >&2
            exit 1
          fi

          echo "image=${DESTINATION_IMAGE}" >>"${GITHUB_OUTPUT}"
          echo "digest=${DESTINATION_DIGEST}" >>"${GITHUB_OUTPUT}"

      - name: Pin promoted digest in PROD overlay
        env:
          PROD_IMAGE: ${{ steps.promoted.outputs.image }}
          PROD_DIGEST: ${{ steps.promoted.outputs.digest }}
        run: |
          OVERLAY_FILE="infrastructure/k8s/apps/coffeeshop/overlays/prod/kustomization.yaml"
          bash scripts/ci/update-kustomize-image.sh \
            "${OVERLAY_FILE}" "${{ inputs.service }}" "${PROD_IMAGE}" "${PROD_DIGEST}"

      - name: Record PROD artifact promotion
        env:
          SERVICE: ${{ inputs.service }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_DIGEST: ${{ steps.candidate.outputs.digest }}
          PROD_IMAGE: ${{ steps.promoted.outputs.image }}
          PROD_DIGEST: ${{ steps.promoted.outputs.digest }}
        run: |
          RELEASE_DIR="infrastructure/releases/prod/${SERVICE}"
          mkdir -p "${RELEASE_DIR}"
          RUNTIME_SCOPE="desired-state"
          jq -n \
            --arg service "${SERVICE}" \
            --arg source_commit "${SOURCE_COMMIT}" \
            --arg source_digest "${SOURCE_DIGEST}" \
            --arg prod_image "${PROD_IMAGE}" \
            --arg prod_digest "${PROD_DIGEST}" \
            --arg runtime_scope "${RUNTIME_SCOPE}" \
            --arg workflow_run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg promoted_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema_version: 1,
              service: $service,
              source_commit: $source_commit,
              source_digest: $source_digest,
              prod_image: $prod_image,
              prod_digest: $prod_digest,
              runtime_scope: $runtime_scope,
              workflow_run: $workflow_run,
              promoted_at: $promoted_at
            }' >"${RELEASE_DIR}/${SOURCE_COMMIT}.json"

      - name: Open protected PROD desired-state PR
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ secrets.GITOPS_PR_TOKEN }}
          SERVICE: ${{ inputs.service }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "infrastructure/releases/prod/${SERVICE}/${SOURCE_COMMIT}.json"
          git add infrastructure/k8s/apps/coffeeshop/overlays/prod/kustomization.yaml

          if git diff --cached --quiet; then
            echo "PROD already pins this QA-approved digest."
            exit 0
          fi

          git commit -m "chore(prod): promote QA-approved ${SERVICE} digest ${SOURCE_DIGEST}"
          bash scripts/ci/create-gitops-pr.sh \
            "${DEFAULT_BRANCH}" \
            "automation/prod-${SERVICE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "chore(prod): promote QA-approved ${SERVICE} ${SOURCE_COMMIT::12}" \
            "Zero-rebuild promotion of ${SERVICE}@${SOURCE_DIGEST}; the exact digest updates the PROD desired-state release set."
