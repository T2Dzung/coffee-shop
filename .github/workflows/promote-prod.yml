name: PROD Immutable Web Promotion

on:
  workflow_dispatch:
    inputs:
      gitops_branch:
        description: 'Git branch containing the reviewed source and PROD desired state'
        required: true
        default: 'main'

permissions:
  id-token: write
  contents: write

concurrency:
  group: promote-prod-${{ inputs.gitops_branch }}
  cancel-in-progress: false

jobs:
  promote-prod:
    name: Build Once, Scan and Promote to PROD
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.gitops_branch }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Resolve checked-out commit
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Build CoffeeShop Web Binary
        run: bash scripts/ci/build-go-service.sh web

      - name: Build CoffeeShop Web Image Once
        env:
          IMAGE_TAG: ${{ steps.source.outputs.sha }}
        run: |
          docker build \
            -t "go-coffeeshop-web:${IMAGE_TAG}" \
            -f docker/Dockerfile-web .

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: go-coffeeshop-web:${{ steps.source.outputs.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Cloud credentials are requested only after the local artifact passes scan.
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.PROD_AWS_ROLE_ARN }}
          aws-region: ${{ vars.PROD_AWS_REGION || 'ap-southeast-1' }}
          mask-aws-account-id: true

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Push Image to PROD ECR Repository
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.source.outputs.sha }}
        run: |
          docker tag \
            "go-coffeeshop-web:${IMAGE_TAG}" \
            "${ECR_REGISTRY}/go-coffeeshop-web:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/go-coffeeshop-web:${IMAGE_TAG}"

      - name: Resolve Immutable Image Digest from ECR
        id: resolve-digest
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.source.outputs.sha }}
        run: |
          DIGEST="$(aws ecr describe-images \
            --repository-name go-coffeeshop-web \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Error: Failed to resolve ECR image digest for tag ${IMAGE_TAG}" >&2
            exit 1
          fi
          
          echo "Resolved ECR Digest: ${DIGEST}"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Update PROD Overlay Kustomization with Resolved Digest
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          RESOLVED_DIGEST: ${{ steps.resolve-digest.outputs.digest }}
        run: |
          OVERLAY_FILE="infrastructure/k8s/apps/coffeeshop/overlays/prod/kustomization.yaml"
          
          sed -i "s|newName:.*|newName: ${ECR_REGISTRY}/go-coffeeshop-web|g" "${OVERLAY_FILE}"
          sed -i "s|digest:.*|digest: ${RESOLVED_DIGEST}|g" "${OVERLAY_FILE}"
          
          echo "Updated ${OVERLAY_FILE}:"
          cat "${OVERLAY_FILE}"

      - name: Commit and Push Desired State Change to Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add infrastructure/k8s/apps/coffeeshop/overlays/prod/kustomization.yaml
          
          if git diff --staged --quiet; then
            echo "No changes to commit (digest unchanged)."
          else
            git commit -m "chore(prod): promote web artifact ${{ steps.source.outputs.sha }} to PROD overlay [skip ci]"
            git push origin "HEAD:${{ inputs.gitops_branch }}"
          fi
