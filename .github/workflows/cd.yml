name: CD — Build, Push & Deploy (GitOps)

on:
  push:
    branches: [ feat/k3s-ha ]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Path Filtering for Monorepo Optimization
  detect-changes:
    name: Detect Changes
    runs-on: coffeeshop-runner-v3
    outputs:
      services: ${{ steps.set-matrix.outputs.services }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Filter Paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          filters: |
            shared:
              - 'go.mod'
              - 'go.sum'
              - 'pkg/**'
              - 'internal/pkg/**'
              - 'db/**'
              - 'proto/**'
              - 'tools/**'
              - 'third_party/**'
              - 'sqlc.yaml'
              - 'buf.gen.yaml'
              - 'buf.work.yaml'
              - 'Makefile'
              - '.golangci.yml'
              - '.github/workflows/**'
            counter:
              - 'cmd/counter/**'
              - 'internal/counter/**'
              - 'docker/Dockerfile-counter'
            barista:
              - 'cmd/barista/**'
              - 'internal/barista/**'
              - 'docker/Dockerfile-barista'
            kitchen:
              - 'cmd/kitchen/**'
              - 'internal/kitchen/**'
              - 'docker/Dockerfile-kitchen'
            product:
              - 'cmd/product/**'
              - 'internal/product/**'
              - 'docker/Dockerfile-product'
            proxy:
              - 'cmd/proxy/**'
              - 'internal/proxy/**'
              - 'docker/Dockerfile-proxy'
            web:
              - 'cmd/web/**'
              - 'internal/web/**'
              - 'docker/Dockerfile-web'

      - name: Generate Dynamic Matrix
        id: set-matrix
        run: |
          SHARED="${{ steps.filter.outputs.shared }}"

          if [ "$SHARED" = "true" ]; then
            SERVICES_JSON='["counter","barista","kitchen","product","proxy","web"]'
          else
            RAW_CHANGES='${{ steps.filter.outputs.changes }}'
            if [ -z "$RAW_CHANGES" ] || [ "$RAW_CHANGES" = "null" ] || [ "$RAW_CHANGES" = "[]" ]; then
              SERVICES_JSON='[]'
            else
              SERVICES_JSON=$(printf '%s' "$RAW_CHANGES" | jq -c 'map(select(. != "shared"))')
            fi
          fi

          echo "services=$SERVICES_JSON" >> "$GITHUB_OUTPUT"

  # 2. Build, Scan, Push to ECR & Update K8s Manifests (GitOps)
  build-push-deploy:
    name: Build, Push & Deploy
    needs: [detect-changes]
    runs-on: coffeeshop-runner-v3
    permissions:
      contents: write
      id-token: write
    if: |
      needs.detect-changes.outputs.services != '[]' &&
      needs.detect-changes.outputs.services != ''
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Go Environment
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Build Go Binary
        env:
          # Longhorn RWX persists across ephemeral runners. Partition both Go
          # caches by service so matrix jobs never contend for the same locks.
          GOMODCACHE: /go-cache/mod/${{ matrix.service }}
          GOCACHE: /go-cache/build/${{ matrix.service }}
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p ./bin "$GOMODCACHE" "$GOCACHE"
          go build -v -tags migrate -ldflags="-w -s" -o ./bin/${{ matrix.service }} ./cmd/${{ matrix.service }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build Docker Image Locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./docker/Dockerfile-${{ matrix.service }}
          push: false
          tags: go-coffeeshop-${{ matrix.service }}:${{ github.sha }}
          load: true

      - name: Trivy Container Image Scan (DevSecOps Gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Trivy's cache is job-local; it must not contend with Go module
          # cache writes on the shared RWX volume.
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache/${{ matrix.service }}
        with:
          version: 'v0.72.0'
          image-ref: go-coffeeshop-${{ matrix.service }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
          cache: 'false'

      - name: Validate AWS OIDC Role Secret
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error title=Missing GitHub secret::Set repository secret AWS_ROLE_ARN to arn:aws:iam::423623841278:role/coffeeshop-dev-github-actions-role"
            exit 1
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Push Docker Image to ECR
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./docker/Dockerfile-${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/go-coffeeshop-${{ matrix.service }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/go-coffeeshop-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2

      - name: Update Kustomize Overlay & Push to GitHub (GitOps)
        env:
          CURRENT_BRANCH: ${{ github.ref_name }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Retry loop to avoid race conditions in monorepos when multiple jobs push simultaneously
          for i in {1..10}; do
            echo "Attempt $i to push manifest update..."
            git fetch origin "$CURRENT_BRANCH"
            git checkout "$CURRENT_BRANCH"
            git reset --hard "origin/$CURRENT_BRANCH"
            
            # Use kustomize to update image URL safely in the dev overlay
            cd infrastructure/k8s/gitops/apps/coffeeshop/overlays/dev
            kustomize edit set image ${{ steps.login-ecr.outputs.registry }}/go-coffeeshop-${{ matrix.service }}=${{ steps.login-ecr.outputs.registry }}/go-coffeeshop-${{ matrix.service }}:${{ github.sha }}
            cd -
            
            git add infrastructure/k8s/gitops/apps/coffeeshop/overlays/dev/kustomization.yaml
            git commit -m "chore(gitops): update ${{ matrix.service }} image tag to ${{ github.sha }} [skip ci]" || { echo "No changes to commit"; exit 0; }
            
            if git push origin "$CURRENT_BRANCH"; then
              echo "Push successful!"
              break
            else
              echo "Push conflict detected, retrying in 5 seconds..."
              sleep 5
            fi
          done

      - name: Docker System Garbage Collection
        if: always()
        run: |
          echo "=== TIẾN HÀNH DỌN DẸP DUNG LƯỢNG ĐĨA CỨNG CỤC BỘ ==="
          docker system prune -f --volumes
          df -h

  # 3. Unified Status Check & ChatOps Notification
  deploy-status:
    name: Deploy Status
    needs: build-push-deploy
    runs-on: coffeeshop-runner-v3
    if: always() && !cancelled()
    steps:
      - name: Verify Deploy Status & Set Notification Details
        id: status_check
        run: |
          RESULT="${{ needs.build-push-deploy.result }}"
          echo "Build-Push-Deploy matrix result: $RESULT"
          
          if [ "$RESULT" = "success" ] || [ "$RESULT" = "skipped" ]; then
            echo "status_emoji=✅" >> "$GITHUB_OUTPUT"
            echo "status_text=THÀNH CÔNG" >> "$GITHUB_OUTPUT"
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          else
            echo "status_emoji=❌" >> "$GITHUB_OUTPUT"
            echo "status_text=THẤT BẠI" >> "$GITHUB_OUTPUT"
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve Branch & Commit Info
        id: info
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -n 1)
          echo "change_desc=$FIRST_LINE" >> "$GITHUB_OUTPUT"

      - name: Send Telegram Notification
        env:
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        if: ${{ env.TELEGRAM_TO != '' && env.TELEGRAM_TOKEN != '' }}
        uses: appleboy/telegram-action@221e6b684967abe813051ee4a37dd61770a83ad3 # v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            ${{ steps.status_check.outputs.status_emoji }} *DỰ ÁN COFFEE-SHOP: CD PIPELINE ${{ steps.status_check.outputs.status_text }}*
            
            *👤 Người thực hiện:* ${{ github.actor }}
            *🌿 Nhánh:* `${{ steps.info.outputs.branch }}`
            *📝 Thay đổi:* `${{ steps.info.outputs.change_desc }}`
            
            🔗 *Chi tiết Workflow:* [Xem log chi tiết trên GitHub](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Enforce Pipeline Result
        run: |
          exit ${{ steps.status_check.outputs.exit_code }}
