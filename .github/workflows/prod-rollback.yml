name: PROD — Roll Back Released Digest

on:
  workflow_dispatch:
    inputs:
      service:
        description: Component to roll back from reviewed release history
        required: true
        type: string
      source_commit:
        description: Full 40-character commit identifying a prior PROD release
        required: true

permissions:
  id-token: write
  contents: write
  pull-requests: write

concurrency:
  group: prod-desired-state
  cancel-in-progress: false

jobs:
  rollback:
    uses: ./.github/workflows/_reusable-prod-delivery.yml
    with:
      lane: rollback
      service: ${{ inputs.service }}
      source_commit: ${{ inputs.source_commit }}
    secrets:
      GITOPS_PR_TOKEN: ${{ secrets.GITOPS_PR_TOKEN }}

  rollback-status:
    name: PROD Rollback Status
    needs: [rollback]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout notification action
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Notify rollback result
        uses: ./.github/actions/notify-telegram
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_TO }}
          title: PROD rollback
          status: ${{ needs.rollback.result == 'success' && 'ROLLBACK' || 'FAILED' }}
          details: ${{ inputs.service }} to ${{ inputs.source_commit }}

      - name: Enforce rollback result
        env:
          DELIVERY: ${{ needs.rollback.result }}
        run: |
          set -Eeuo pipefail
          [[ "${DELIVERY}" == "success" ]]
