name: CI — Application Gate

on:
  pull_request:
  merge_group:

concurrency:
  group: ci-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Report legacy application lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        continue-on-error: true
        with:
          version: v2.12.2
          args: --timeout=5m

  detect-components:
    name: Detect Application Components
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.result.outputs.matrix }}
    steps:
      - name: Checkout change with history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Set up typed component resolver
        id: platformctl
        uses: ./.github/actions/setup-platformctl

      - name: Select changed service components
        id: changed
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/detect-components
        with:
          platformctl: ${{ steps.platformctl.outputs.path }}
          mode: changed
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          kind: service

      - name: Select all services for merge queue
        id: all
        if: github.event_name == 'merge_group'
        uses: ./.github/actions/detect-components
        with:
          platformctl: ${{ steps.platformctl.outputs.path }}
          mode: all
          kind: service

      - name: Publish build matrix
        id: result
        env:
          CHANGED: ${{ steps.changed.outputs.matrix }}
          ALL: ${{ steps.all.outputs.matrix }}
        run: echo "matrix=${CHANGED:-${ALL:-[]}}" >>"${GITHUB_OUTPUT}"

  build-and-scan:
    name: Build & Scan
    needs: [detect-components]
    if: needs.detect-components.outputs.components != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.detect-components.outputs.components) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build component binary
        run: bash scripts/ci/build-go-service.sh "${{ matrix.component }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build local image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./docker/Dockerfile-${{ matrix.component }}
          push: false
          tags: go-coffeeshop-${{ matrix.component }}:${{ github.sha }}
          load: true

      - name: Scan local image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: go-coffeeshop-${{ matrix.component }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

  ci-status:
    name: CI Status
    needs: [lint, detect-components, build-and-scan]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce application checks
        env:
          LINT: ${{ needs.lint.result }}
          DETECT: ${{ needs.detect-components.result }}
          BUILD: ${{ needs.build-and-scan.result }}
        run: |
          set -Eeuo pipefail
          [[ "${LINT}" != "failure" && "${LINT}" != "cancelled" ]]
          [[ "${DETECT}" == "success" ]]
          [[ "${BUILD}" == "success" || "${BUILD}" == "skipped" ]]
