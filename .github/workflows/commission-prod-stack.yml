name: PROD — Commission Full Stack Without DEV

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full 40-character commit from the protected default branch
        required: true

permissions:
  id-token: write
  contents: write
  pull-requests: write

concurrency:
  group: prod-desired-state
  cancel-in-progress: false

jobs:
  commission:
    name: Build, Scan & Submit One Full-Stack Release PR
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout protected desired state
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITOPS_PR_TOKEN }}

      - name: Validate commissioning source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          [[ "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source_commit must be a full lowercase Git SHA." >&2
            exit 1
          }
          git merge-base --is-ancestor "${SOURCE_COMMIT}" HEAD || {
            echo "Commissioning source is not contained in protected main." >&2
            exit 1
          }

      - name: Checkout exact application source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.source_commit }}
          path: source

      - name: Configure PROD credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.PROD_AWS_ROLE_ARN }}
          aws-region: ${{ vars.PROD_AWS_REGION || 'ap-southeast-1' }}
          mask-aws-account-id: true

      - name: Log in to PROD ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: source/go.mod
          cache: true
          cache-dependency-path: source/go.sum

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build seven local images from the exact source
        working-directory: source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          for service in web proxy product counter barista kitchen migrate; do
            bash scripts/ci/build-go-service.sh "${service}"
            docker build \
              --file "docker/Dockerfile-${service}" \
              --tag "go-coffeeshop-${service}:${SOURCE_COMMIT}" \
              .
          done

      - name: Scan web
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: go-coffeeshop-web:${{ inputs.source_commit }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          cache: 'true'
      - name: Scan proxy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: go-coffeeshop-proxy:${{ inputs.source_commit }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          cache: 'true'
      - name: Scan product
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: go-coffeeshop-product:${{ inputs.source_commit }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          cache: 'true'
      - name: Scan counter
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: go-coffeeshop-counter:${{ inputs.source_commit }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          cache: 'true'
      - name: Scan barista
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: go-coffeeshop-barista:${{ inputs.source_commit }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          cache: 'true'
      - name: Scan kitchen
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: go-coffeeshop-kitchen:${{ inputs.source_commit }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          cache: 'true'
      - name: Scan migrate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: go-coffeeshop-migrate:${{ inputs.source_commit }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          cache: 'true'

      - name: Push and pin the immutable release set
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          release_json='{}'
          for service in web proxy product counter barista kitchen migrate; do
            local_ref="go-coffeeshop-${service}:${SOURCE_COMMIT}"
            image="${REGISTRY}/go-coffeeshop-${service}"
            remote_ref="${image}:commissioning-${SOURCE_COMMIT}"
            docker tag "${local_ref}" "${remote_ref}"
            docker push "${remote_ref}"
            digest="$(aws ecr describe-images \
              --repository-name "go-coffeeshop-${service}" \
              --image-ids "imageTag=commissioning-${SOURCE_COMMIT}" \
              --query 'imageDetails[0].imageDigest' \
              --output text)"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "Invalid digest for ${service}: ${digest}" >&2
              exit 1
            }
            bash scripts/ci/update-kustomize-image.sh \
              infrastructure/k8s/apps/coffeeshop/overlays/prod/kustomization.yaml \
              "${service}" "${image}" "${digest}"
            release_json="$(jq \
              --arg service "${service}" \
              --arg image "${image}" \
              --arg digest "${digest}" \
              '. + {($service): {image: $image, digest: $digest}}' \
              <<<"${release_json}")"
          done

          mkdir -p infrastructure/releases/prod/release-sets
          jq -n \
            --arg source_commit "${SOURCE_COMMIT}" \
            --arg workflow_run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg commissioned_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson components "${release_json}" \
            '{
              schema_version: 1,
              release_mode: "commissioning",
              source_commit: $source_commit,
              runtime_scope: "full-stack-desired-state",
              workflow_run: $workflow_run,
              commissioned_at: $commissioned_at,
              components: $components
            }' >"infrastructure/releases/prod/release-sets/${SOURCE_COMMIT}.json"

      - name: Open one protected full-stack desired-state PR
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ secrets.GITOPS_PR_TOKEN }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            infrastructure/k8s/apps/coffeeshop/overlays/prod/kustomization.yaml \
            "infrastructure/releases/prod/release-sets/${SOURCE_COMMIT}.json"
          git commit -m "chore(prod): commission full stack ${SOURCE_COMMIT::12}"
          bash scripts/ci/create-gitops-pr.sh \
            "${DEFAULT_BRANCH}" \
            "automation/commission-prod-stack-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "chore(prod): commission full stack ${SOURCE_COMMIT::12}" \
            "Initial PROD-3 commissioning: seven CRITICAL-scanned images, immutable ECR digests and one reviewed desired-state release set."
